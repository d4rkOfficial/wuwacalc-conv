    { key: 'weekUpdates', cn: '本周优化更新', en: 'WEEKLY UPDATES', img: 'week-updates.png', detail: 'updates' },
  ];

  function passed() {
    try {
      return sessionStorage.getItem(SESSION_KEY) === '1';
    } catch (e) {
      return false;
    }
  }

  function markPassed() {
    try {
      sessionStorage.setItem(SESSION_KEY, '1');
    } catch (e) {}
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function showToolboxNotice() {
    if (!/^(?:www\.)?wuwacalc\.cn$/.test(location.hostname)) return;
    if (document.body.classList.contains('intro-open')) return;
    try {
      if (sessionStorage.getItem(TOOLBOX_NOTICE_KEY) === '1') return;
    } catch (e) {}
    if (document.getElementById('wcToolboxNotice')) return;

    if (!document.getElementById('wcToolboxNoticeStyle')) {
      var style = document.createElement('style');
      style.id = 'wcToolboxNoticeStyle';
      style.textContent =
        '.wc-toolbox-notice{position:fixed;inset:0;z-index:100080;display:grid;place-items:center;padding:20px;background:rgba(8,10,16,.76)}' +

        '.wc-toolbox-notice-body{padding:18px 22px 22px}' +
        '.wc-toolbox-notice-title{margin:0 0 6px;font-size:20px;line-height:1.35}' +
        '.wc-toolbox-notice-desc{margin:0 0 16px;font-size:14px;line-height:1.6;color:#5b554b}' +
        '.wc-toolbox-notice-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}' +
        '.wc-toolbox-notice-link{display:inline-flex;min-height:44px;align-items:center;justify-content:center;padding:0 18px;border-radius:7px;background:#32302c;color:#fff;text-decoration:none;font-weight:600}' +
        '.wc-toolbox-notice-link:hover{background:#4c4030;color:#fff}' +
        '.wc-toolbox-notice-code{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 13px;border:1px solid #c8b99d;border-radius:7px;background:#fff9ed;color:#382f22;user-select:text}' +
        '.wc-toolbox-notice-later{min-height:44px;margin-left:auto;padding:0 10px;border:0;background:transparent;color:#605a50;font:inherit;cursor:pointer}' +
        '.wc-toolbox-notice-close{position:absolute;top:10px;right:10px;width:40px;height:40px;border:0;border-radius:50%;background:rgba(20,20,20,.7);color:#fff;font-size:24px;line-height:1;cursor:pointer}' +
        '.wc-toolbox-notice a:focus-visible,.wc-toolbox-notice button:focus-visible{outline:3px solid #b88c39;outline-offset:2px}' +
        '@media(max-width:520px){.wc-toolbox-notice{padding:12px}.wc-toolbox-notice-card{max-height:calc(100vh - 24px)}.wc-toolbox-notice-body{padding:16px}.wc-toolbox-notice-title{font-size:18px}.wc-toolbox-notice-later{margin-left:0}}';
      document.head.appendChild(style);
    }

    var overlay = document.createElement('div');
    overlay.id = 'wcToolboxNotice';
    overlay.className = 'wc-toolbox-notice';
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.setAttribute('aria-labelledby', 'wcToolboxNoticeTitle');
    overlay.innerHTML =
      '<div class="wc-toolbox-notice-card">' +
      '<button type="button" class="wc-toolbox-notice-close" data-toolbox-close aria-label="关闭公告">×</button>' +
      '<img class="wc-toolbox-notice-image" src="assets/brand/toolbox-announcement-20260928.webp?v=20260928" alt="鸣算屋工具箱上线：本地计算，不再受服务器网速影响">' +
      '<div class="wc-toolbox-notice-body">' +
      '<h2 class="wc-toolbox-notice-title" id="wcToolboxNoticeTitle">本地工具箱已上线</h2>' +
      '<p class="wc-toolbox-notice-desc">Windows 版工具箱现已开放下载。计算与配置可在本机运行，不再受网站服务器网速影响。</p>' +
      '<div class="wc-toolbox-notice-actions">' +
      '<a class="wc-toolbox-notice-link" href="https://pan.quark.cn/s/50aaac819d94" target="_blank" rel="noopener noreferrer">前往网盘下载</a>' +
      '<span class="wc-toolbox-notice-code">提取码 <strong>dNMs</strong></span>' +
      '<button type="button" class="wc-toolbox-notice-later" data-toolbox-close>继续使用网站</button>' +
      '</div></div></div>';
    document.body.appendChild(overlay);
    try { sessionStorage.setItem(TOOLBOX_NOTICE_KEY, '1'); } catch (e) {}

    function closeNotice() {
      document.removeEventListener('keydown', onNoticeKeydown);
      overlay.remove();
    }
    function onNoticeKeydown(event) {
      if (event.key === 'Escape') closeNotice();
    }
    overlay.querySelectorAll('[data-toolbox-close]').forEach(function (button) {
      button.addEventListener('click', closeNotice);
    });
    overlay.addEventListener('click', function (event) {
      if (event.target === overlay) closeNotice();
    });
    document.addEventListener('keydown', onNoticeKeydown);
    overlay.querySelector('.wc-toolbox-notice-close').focus();
  }

  function enterApp() {
    markPassed();
    closeDetail();
    document.documentElement.classList.remove('intro-pending');
    document.body.classList.remove('intro-open');
    if (window.WaveCalcBgm && typeof WaveCalcBgm.syncHint === 'function') {
      WaveCalcBgm.syncHint();
    }
    if (window.WaveCalcBgm && typeof WaveCalcBgm.unlockAndPlay === 'function') {
      void WaveCalcBgm.unlockAndPlay();
    }
    if (window.Cloud && typeof Cloud.close === 'function') {
      try {
        Cloud.close();
      } catch (e) {}
    }
    if (root) {
      root.classList.add('is-leaving');
      window.setTimeout(function () {
        if (root) {
          root.hidden = true;
          root.remove();
          root = null;
        }
      }, 450);
    }
    window.setTimeout(showToolboxNotice, 520);
  }

  function onDriftAction(event) {
    if (event.origin !== location.origin || !root || !document.body.classList.contains('intro-open')) return;
    var frame = root.querySelector('.site-intro-drift-frame');
    if (!frame || event.source !== frame.contentWindow) return;
    var action = event.data && event.data.wavecalcIntroAction;
    if (action === 'login') {
      if (window.WaveCalcAuth && typeof WaveCalcAuth.open === 'function') WaveCalcAuth.open({ origin: 'intro' });
      else if (window.Cloud && typeof Cloud.open === 'function') Cloud.open('auth');
    } else if (action === 'guest') {
      enterApp();
    } else if (action === 'public-db') {
      enterApp();
      var code = String(event.data && event.data.shareCode || '').toUpperCase();
      if (/^MC-[A-Z0-9]{6}$/.test(code) && window.PublicDb && typeof PublicDb.openDetail === 'function') {
        PublicDb.open();
        var dbPage = document.getElementById('publicDbPage');
        var detailOpened = false;
        var observer;
        var showDetail = function () {
          if (detailOpened || !dbPage || !dbPage.querySelector('.pdb-list .data-card')) return;
          detailOpened = true;
          if (observer) observer.disconnect();
          PublicDb.openDetail(code);
        };
        observer = new MutationObserver(showDetail);
        if (dbPage) observer.observe(dbPage, { childList: true, subtree: true });
        showDetail();
        window.setTimeout(function () {
          if (observer) observer.disconnect();
          if (!detailOpened) PublicDb.openDetail(code);
        }, 5000);
      } else if (window.PublicDb && typeof PublicDb.open === 'function') PublicDb.open();
      else {
        var nav = document.querySelector('[data-nav-public-db]');
        if (nav) nav.click();
      }
    }
  }
  window.addEventListener('message', onDriftAction);

  function buildRoot() {
    root = document.getElementById('siteIntro');
    if (!root) {
      root = document.createElement('div');
      root.id = 'siteIntro';
      root.className = 'site-intro';
      root.setAttribute('role', 'dialog');
      root.setAttribute('aria-label', '鸣算屋开场');
      document.body.insertBefore(root, document.body.firstChild);
    }
    root.removeAttribute('aria-hidden');
    root.innerHTML = '<iframe class="site-intro-drift-frame" src="intro-drift.html?embedded=1&v=63fc6fc471" title="鸣算屋滑动首屏" style="position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#101116" loading="eager"></iframe>';
    return;
    root.innerHTML =
      '<div class="site-intro-bg" aria-hidden="true">' +
      '<img class="site-intro-wallpaper" src="' + WALLPAPER + '" alt="" decoding="async" />' +
      '<div class="site-intro-fade"></div>' +
      '<div class="site-intro-fade-left"></div>' +
      '</div>' +
      '<div class="site-intro-shell">' +
      '<header class="site-intro-top">' +
      '<div class="site-intro-brand">' +
      '<img class="site-intro-logo" src="assets/brand/logo-transparent.png" alt="" width="44" height="44" decoding="async" />' +
      '<div class="site-intro-brand-text">' +
      '<span class="site-intro-brand-cn">鸣算屋</span>' +
      '<span class="site-intro-brand-en">WAVECALC</span>' +
      '</div></div>' +
      '<div class="site-intro-actions">' +
      '<button type="button" class="btn site-intro-btn" data-intro-login>登录 / 注册</button>' +
      '<button type="button" class="btn site-intro-btn primary" data-intro-guest>游客访问</button>' +
      '</div></header>' +
      '<section class="site-intro-stats" aria-label="站内数据">' +
      CARDS.map(function (c) {
        var detailAttr = c.detail ? ' data-intro-detail="' + c.detail + '"' : '';
        var roleAttr = c.detail ? ' role="button" tabindex="0"' : '';
        return '<div class="site-intro-card' + (c.detail ? ' is-clickable' : '') + '"' + detailAttr + roleAttr + '>' +
          '<div class="site-intro-card-body">' +
          '<span class="site-intro-card-en">' + c.en + '</span>' +
          '<span class="site-intro-card-cn">' + c.cn + '</span>' +
          '<strong class="site-intro-card-num" data-intro-num="' + c.key + '">—</strong>' +
          '</div>' +
          '<img class="site-intro-card-emoji" src="' + EMOJI_BASE + c.img + '" alt="" loading="lazy" />' +
          '</div>';
      }).join('') +
      '</section>' +
      '<p class="site-intro-hint">游客可直接使用计算器；登录后可上传公开方案。点击数据卡片可查看明细。</p>' +
      '</div>';

    bind();
    loadStats();
  }

  function bind() {
    document.addEventListener('keydown', onDocKeydown);
    var loginBtn = root.querySelector('[data-intro-login]');
    var guestBtn = root.querySelector('[data-intro-guest]');
    if (loginBtn) {
      loginBtn.addEventListener('click', function () {
        if (window.WaveCalcAuth && typeof WaveCalcAuth.open === 'function') {
          WaveCalcAuth.open({ origin: 'intro' });
        } else if (window.Cloud && typeof Cloud.open === 'function') {
          Cloud.open('auth');
        }
      });
    }
    if (guestBtn) {
      guestBtn.addEventListener('click', function () {
        enterApp();
      });
    }
    root.querySelectorAll('[data-intro-detail]').forEach(function (card) {
      card.addEventListener('click', function () {
        openDetail(card.getAttribute('data-intro-detail'));
      });
      card.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openDetail(card.getAttribute('data-intro-detail'));
        }
      });
    });
  }

  function fmtNum(v) {
    return String(v == null ? '—' : v).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function loadStats() {
    fetch('/api/home-stats', { headers: { accept: 'application/json' } })
      .then(function (r) {
        return r.ok ? r.json() : null;
      })
      .then(function (data) {
        if (!data || !root) return;
        homeData = data;
        var map = {
          totalSchemes: data.totalSchemes,
          todaySchemes: data.todaySchemes,
          todayMatrix: data.todayMatrix,
        };
        root.querySelectorAll('[data-intro-num]').forEach(function (el) {
          var v = map[el.getAttribute('data-intro-num')];
          if (typeof v === 'number') el.textContent = fmtNum(v);
        });
      })
      .catch(function () {
        /* 数字保持 — */
      });
    // 本周优化更新：以「部署上线改动汇总」为准（每次部署时维护 optimization-updates.json）
    fetch('/assets/brand/optimization-updates.json', { headers: { accept: 'application/json' } })
      .then(function (r) {
        return r.ok ? r.json() : null;
      })
      .then(function (data) {
        if (!data || !root) return;
        changelog = Array.isArray(data.entries) ? data.entries : [];
        var weekNum = thisWeekEntries().length;
        var numEl = root.querySelector('[data-intro-num="weekUpdates"]');
        if (numEl) numEl.textContent = fmtNum(weekNum || changelog.length);
      })
      .catch(function () {
        /* 忽略 */
      });
  }

  function thisWeekEntries() {
    if (!changelog) return [];
    var weekAgo = new Date(Date.now() - 7 * 24 * 3600 * 1000).toISOString().slice(0, 10);
    return changelog.filter(function (e) {
      return e && e.date && String(e.date).slice(0, 10) >= weekAgo;
    });
  }

  function closeDetail() {
    if (detailEl) {
      detailEl.remove();
      detailEl = null;
    }
  }

  function openDetail(kind) {
    if (!homeData) return;
    closeDetail();
    var title = '';
    var rows = [];
    var emptyText = '';
    if (kind === 'schemes') {
      title = '今日更新方案';
      emptyText = '今日暂无更新方案';
      rows = (homeData.todaySchemesList || []).map(function (r) {
        return '<div class="site-intro-detail-row">' +
          '<span class="site-intro-detail-row-title">' + esc(r.title) + '</span>' +
          '<span class="site-intro-detail-row-sub">' + esc(r.shareCode) + ' · 更新 ' + esc(String(r.updatedAt || '').slice(0, 10)) + '</span>' +
          '</div>';
      });
    } else if (kind === 'matrix') {
      title = '今日矩阵数据';
      emptyText = '今日暂无矩阵数据';
      rows = (homeData.todayMatrixList || []).map(function (r) {
        return '<div class="site-intro-detail-row">' +
          '<span class="site-intro-detail-row-title">' + esc(r.playerName) + (r.boss ? ' · ' + esc(r.boss) : '') + '</span>' +
          '<span class="site-intro-detail-row-sub">分数 ' + fmtNum(r.score) + ' · ' + esc(String(r.createdAt || '').slice(0, 10)) + '</span>' +
          '</div>';
      });
    } else {
      title = '本周优化更新';
      emptyText = '本周暂无更新记录';
      var weekRows = thisWeekEntries();
      var showRows = weekRows.length ? weekRows : changelog.slice(0, 5);
      rows = showRows.map(function (r) {
        return '<div class="site-intro-detail-row">' +
          '<span class="site-intro-detail-row-title">' + esc(r.title) + '</span>' +
          '<span class="site-intro-detail-row-sub">' + esc(r.date) + '</span>' +
          '<span class="site-intro-detail-row-content">' + esc(r.summary || r.content) + '</span>' +
          '</div>';
      });
      if (!weekRows.length && rows.length) {
        rows.unshift(
          '<div class="site-intro-detail-note">本周暂无部署更新，以下为最近更新</div>'
        );
      }
    }
    detailEl = document.createElement('div');
    detailEl.className = 'site-intro-detail';
    detailEl.innerHTML =
      '<div class="site-intro-detail-card">' +
      '<div class="site-intro-detail-head">' +
      '<strong>' + esc(title) + '</strong>' +
      '<button type="button" class="site-intro-detail-close" data-intro-detail-close aria-label="关闭">✕</button>' +
      '</div>' +
      '<div class="site-intro-detail-body">' +
      (rows.length ? rows.join('') : '<div class="site-intro-detail-empty">' + emptyText + '</div>') +
      '</div></div>';
    (root || document.body).appendChild(detailEl);
    var closeBtn = detailEl.querySelector('[data-intro-detail-close]');
    if (closeBtn) closeBtn.addEventListener('click', closeDetail);
    detailEl.addEventListener('click', function (e) {
      if (e.target === detailEl) closeDetail();
    });
  }

  function onDocKeydown(e) {
    if (e.key === 'Escape' && detailEl) {
      closeDetail();
    }
  }

  function showGate() {
    if (gateShown || !root) return;
    gateShown = true;
  }

  function onAuthMaybeEnter() {
    if (!document.body.classList.contains('intro-open')) return;
    if (window.Cloud && typeof Cloud.getUser === 'function' && Cloud.getUser()) {
      enterApp();
    }
  }

  function start() {
    if (passed()) return;
    // 手机端跳过开场闸门：让移动精简首页（mobile-home.js）成为首屏，避免「点卡片→回 PC 闸门」或闸门盖住首页
    if (window.__wcMobile) { return; }
    buildRoot();
    if (root) root.hidden = false;
    document.body.classList.add('intro-open');
    document.documentElement.classList.add('intro-pending');
    gateShown = true;
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }

  window.SiteIntro = {
    enter: enterApp,
    showGate: showGate,
    onAuthMaybeEnter: onAuthMaybeEnter,
    isOpen: function () {
      return document.body.classList.contains('intro-open');
    },
  };
})();
</script>

<script>

    '.sc-announce.is-open{position:absolute;left:0;right:0;top:0;background:var(--bg-deepest,#0d0f13);',

  function injectStyle() {
    if (document.getElementById(STYLE_ID)) return;
    var st = document.createElement('style');
    st.id = STYLE_ID;
    st.textContent = css;
    document.head.appendChild(st);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function readList() {
    try {
      var raw = localStorage.getItem(READ_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  }

  function markRead(id) {
    try {
      var arr = readList();
      if (arr.indexOf(id) < 0) arr.push(id);
      localStorage.setItem(READ_KEY, JSON.stringify(arr));
    } catch (e) {
      /* ignore */
    }
  }

  function getData() {
    var def = (typeof window.SITE_CONTENT !== 'undefined' && window.SITE_CONTENT) || {};
    return {
      announcements: Array.isArray(def.announcements) ? def.announcements : [],
      footer: def.footer || {},
    };
  }

  function mergeFromServer(remote) {
    if (!remote || typeof remote !== 'object') return;
    var base = getData();
    if (Array.isArray(remote.site_announcements)) {
      base.announcements = remote.site_announcements;
    }
    if (remote.site_footer && typeof remote.site_footer === 'object') {
      base.footer = remote.site_footer;
    }
    window.SITE_CONTENT = base;
  }

  function renderAnnouncement() {
    var host = document.getElementById('announcementBar');
    if (!host) return;
    var prevWrap = host.querySelector('.sc-announce');
    var prevOpen = !!(prevWrap && prevWrap.classList.contains('is-open'));
    var data = getData();
    var list = data.announcements || [];
    if (!list.length) {
      host.hidden = true;
      return;
    }
    try {
      if (sessionStorage.getItem(DISMISS_KEY) === '1') {
        host.hidden = true;
        return;
      }
    } catch (e) {
      /* ignore */
    }
    var latest = list[0];
    var autoOpen = false;
    try {
      if (sessionStorage.getItem(AUTO_KEY) !== '1') {
        autoOpen = true;
        sessionStorage.setItem(AUTO_KEY, '1');
      }
    } catch (e) {
      autoOpen = true;
    }
    if (prevOpen) autoOpen = true;
    var unread = readList().indexOf(String(latest.id || latest.title)) < 0;
    if (autoOpen && unread) {
      markRead(String(latest.id || latest.title));
      unread = false;
    }

    var history = list.slice(1);
    var bodyHtml =
      '<div class="sc-announce-body">' +
      '<p class="sc-announce-text">' + esc(latest.content || '') + '</p>' +
      (latest.time ? '<span class="sc-announce-time">发布时间：' + esc(latest.time) + '</span>' : '') +
      (history.length
        ? '<div class="sc-announce-history"><div class="sc-announce-history-title">历史公告</div>' +
          history
            .map(function (a) {
              return (
                '<button type="button" class="sc-announce-item" data-sc-announce-hist="' + esc(String(a.id || a.title)) + '">' +
                esc(a.title || '') +
                '</button>' +
                '<div class="sc-announce-item-body" hidden>' +
                esc(a.content || '') +
                (a.time ? '<span class="sc-announce-time">发布时间：' + esc(a.time) + '</span>' : '') +
                '</div>'
              );
            })
            .join('') +
          '</div>'
        : '') +
      '</div>';

    host.hidden = false;
    host.innerHTML =
      '<div class="sc-announce' + (autoOpen ? ' is-open' : '') + '">' +
      '<button type="button" class="sc-announce-main" data-sc-announce-toggle>' +
      '<span class="sc-announce-icon">📢</span>' +
      (unread ? '<span class="sc-announce-dot" aria-label="有新公告"></span>' : '') +
      '<span class="sc-announce-title">' + esc(latest.title || '') + '</span>' +
      '<span class="sc-announce-arrow">' + (autoOpen ? '收起公告 ▴' : '展开公告 ▾') + '</span>' +
      '</button>' +
      bodyHtml +
      '<button type="button" class="sc-announce-close" data-sc-announce-close aria-label="关闭公告栏">×</button>' +
      '</div>';

    if (!annBound) {
      annBound = true;
      host.addEventListener('click', function (e) {
        var toggle = e.target.closest('[data-sc-announce-toggle]');
        if (toggle) {
          var wrap = host.querySelector('.sc-announce');
          var isOpen = wrap.classList.contains('is-open');
          wrap.classList.toggle('is-open', !isOpen);
          var arrow = wrap.querySelector('.sc-announce-arrow');
          if (arrow) arrow.textContent = !isOpen ? '收起公告 ▴' : '展开公告 ▾';
          if (!isOpen) {
            var cur = getData();
            var curLatest = (cur.announcements || [])[0];
            markRead(String(curLatest && (curLatest.id || curLatest.title)));
            var dot = wrap.querySelector('.sc-announce-dot');
            if (dot) dot.remove();
          }
          return;
        }
        var hist = e.target.closest('[data-sc-announce-hist]');
        if (hist) {
          var body = hist.nextElementSibling;
          if (body) body.hidden = !body.hidden;
          return;
        }
        if (e.target.closest('[data-sc-announce-close]')) {
          try {
            sessionStorage.setItem(DISMISS_KEY, '1');
          } catch (err) {
            /* ignore */
          }
          host.hidden = true;
        }
      });
    }
  }

  function renderFooter() {
    var host = document.getElementById('siteFooter');
    if (!host) return;
    var data = getData();
    var f = data.footer || {};
    var links = Array.isArray(f.links) ? f.links : [];
    var statements = Array.isArray(f.statements) ? f.statements : [];
    host.hidden = false;
    var html = '';
    html += '<p class="sc-footer-line">' + esc(f.brand || '') + (f.copyright ? ' · ' + esc(f.copyright) : '') + '</p>';
    statements.forEach(function (s) {
      html += '<p class="sc-footer-line">' + esc(s) + '</p>';
    });
    if (links.length) {
      html += '<p class="sc-footer-links">';
      links.forEach(function (l, i) {
        if (i > 0) html += '<span class="sc-footer-sep">·</span>';
        var href = String(l.href || '#');
        var target = /^https?:/i.test(href) ? ' target="_blank" rel="noopener noreferrer"' : '';
        html += '<a href="' + esc(href) + '"' + target + '>' + esc(l.label || href) + '</a>';
      });
      html += '</p>';
    }
    host.innerHTML = html;
  }

  function boot() {
    injectStyle();
    // 关闭标记仅作用于当前页面实例：刷新后清除，保证「刷新后重新显示」的预期
    try {
      sessionStorage.removeItem(DISMISS_KEY);
    } catch (e) {
      /* ignore */
    }
    renderAnnouncement();
    renderFooter();
    if (typeof fetch === 'function') {
      fetch('api/site-content')
        .then(function (r) {
          return r.ok ? r.json() : null;
        })
        .then(function (data) {
          if (!data) return;
          mergeFromServer(data);
          renderAnnouncement();
          renderFooter();
        })
        .catch(function () {
          /* 后端不可用时保留默认配置 */
        });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
<script>
/* 快捷键汇总：顶部条「快捷键」按钮 → 弹窗展示全站快捷键 */
(function () {
  'use strict';

  var STYLE_ID = 'wc-shortcuts-style';
  var MODAL_SEL = '[data-wc-shortcuts-modal]';
  var OPEN_SEL = '[data-open-shortcuts]';
  var bound = false;

  var css = [
    '.app-shortcuts-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;',
    'margin-right:10px;border-radius:8px;border:1px solid color-mix(in srgb,var(--accent-primary,#c9a84c) 26%,transparent);',
    'background:color-mix(in srgb,var(--accent-primary,#c9a84c) 7%,transparent);color:var(--text-secondary,#e8ecf5);',
    'font-size:13px;font-family:inherit;cursor:pointer;transition:color .2s,background .2s,border-color .2s;}',
    '.app-shortcuts-btn:hover{color:var(--accent-primary,#c9a84c);border-color:color-mix(in srgb,var(--accent-primary,#c9a84c) 52%,transparent);',
    'background:color-mix(in srgb,var(--accent-primary,#c9a84c) 12%,transparent);}',
    '.app-shortcuts-btn .sc-kbd-icon{width:15px;height:15px;flex:0 0 auto;}',
    '.wc-shortcuts-overlay{position:fixed;inset:0;z-index:200300;display:flex;align-items:center;justify-content:center;',
    'padding:20px;box-sizing:border-box;background:color-mix(in srgb,var(--bg-deepest,#0d0f13) 72%,transparent);',
    'backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}',
    '.wc-shortcuts{width:min(560px,94vw);max-height:82vh;display:flex;flex-direction:column;border-radius:14px;',
    'border:1px solid var(--border,rgba(255,255,255,0.08));background:var(--surface,#161618);color:var(--text-primary,#e8ecf5);',
    'box-shadow:0 24px 70px rgba(0,0,0,0.55);overflow:hidden;}',
    '.wc-shortcuts-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;',
    'border-bottom:1px solid var(--border,rgba(255,255,255,0.08));flex-shrink:0;}',
    '.wc-shortcuts-head strong{font-size:15px;font-weight:700;}',
    '.wc-shortcuts-close{width:30px;height:30px;border:none;border-radius:8px;background:transparent;color:var(--text-muted,#8b94a8);',
    'cursor:pointer;font-size:16px;line-height:1;}',
    '.wc-shortcuts-close:hover{color:var(--text-primary,#e8ecf5);background:var(--hover-bg,rgba(255,255,255,0.06));}',
    '.wc-shortcuts-body{padding:14px 18px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;}',
    '.wc-sc-group-title{font-size:12px;font-weight:700;letter-spacing:0.08em;color:color-mix(in srgb,var(--accent-primary,#c9a84c) 78%,transparent);',
    'margin:0 0 8px;}',
    '.wc-sc-row{display:flex;align-items:flex-start;gap:12px;padding:6px 2px;}',
    '.wc-sc-row + .wc-sc-row{border-top:1px solid rgba(255,255,255,0.04);}',
    '.wc-sc-keys{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:5px;min-width:128px;padding-top:1px;}',
    '.wc-sc-key{display:inline-block;padding:2px 8px;border-radius:6px;border:1px solid color-mix(in srgb,var(--accent-primary,#c9a84c) 36%,transparent);',
    'background:color-mix(in srgb,var(--accent-primary,#c9a84c) 9%,transparent);color:var(--accent-primary,#c9a84c);',
    'font-size:12px;font-weight:600;white-space:nowrap;}',
    '.wc-sc-desc{flex:1;min-width:0;font-size:13px;line-height:1.55;color:var(--text-secondary,#c6cfdd);}',
    '.wc-sc-desc b{color:var(--text-primary,#e8ecf5);font-weight:600;}',
    '@media (max-width:640px){.app-shortcuts-btn span{display:none;}.app-shortcuts-btn{margin-right:6px;padding:0 9px;}}',
  ].join('');

  function injectStyle() {
    if (document.getElementById(STYLE_ID)) return;
    var st = document.createElement('style');
    st.id = STYLE_ID;
    st.textContent = css;
    document.head.appendChild(st);
  }

  var GROUPS = [
    {
      title: '通用',
      rows: [
        { keys: ['Esc'], desc: '关闭当前弹窗 / 面板 / 下拉（详情、上传、叠层、Buff 抽屉等）' },
        { keys: ['Enter'], desc: '确认当前输入（搜索、表单、叠层数值）' },
      ],
    },
    {
      title: '配置选择 & 编轴',
      rows: [
        { keys: ['Ctrl / ⌘', 'Z'], desc: '撤回上一步操作' },
        { keys: ['Shift', '点选'], desc: '技能加入时<b>指定插入位置</b>' },
        { keys: ['Ctrl / ⌘', '点选'], desc: '多选技能（时间线 / 技能列表）' },
        { keys: ['拖拽框选'], desc: '在空白处拖拽框选多个技能' },
        { keys: ['右键技能'], desc: '改名 / 复制 / 合并 / 删除' },
        { keys: ['双击技能'], desc: '直接进入改名' },
        { keys: ['Esc'], desc: '取消当前选择 / 退出合并选取' },
      ],
    },
    {
      title: '计算页',
      rows: [
        { keys: ['Tab'], desc: '开关 Buff 明细抽屉' },
        { keys: ['Esc'], desc: '关闭 Buff 抽屉' },
      ],
    },
    {
      title: 'Buff 检查',
      rows: [
        { keys: ['按住 V', '点击'], desc: '标记该技能已检查完毕（高亮）' },
      ],
    },
    {
      title: '循环轴',
      rows: [
        { keys: ['拖动轮次标签'], desc: '调整多轮循环顺序' },
      ],
    },
  ];

  function groupHtml(g) {
    return (
      '<div class="wc-sc-group">' +
      '<h4 class="wc-sc-group-title">' + g.title + '</h4>' +
      g.rows
        .map(function (r) {
          return (
            '<div class="wc-sc-row">' +
            '<div class="wc-sc-keys">' + r.keys.map(function (k) { return '<span class="wc-sc-key">' + k + '</span>'; }).join('') + '</div>' +
            '<div class="wc-sc-desc">' + r.desc + '</div>' +
            '</div>'
          );
        })
        .join('') +
      '</div>'
    );
  }

  function close() {
    var el = document.querySelector(MODAL_SEL);
    if (el) el.remove();
    document.body.classList.remove('wc-shortcuts-lock');
  }

  function open() {
    close();
    var overlay = document.createElement('div');
    overlay.className = 'wc-shortcuts-overlay';
    overlay.setAttribute('data-wc-shortcuts-modal', '');
    overlay.innerHTML =
      '<div class="wc-shortcuts" role="dialog" aria-modal="true" aria-labelledby="wcShortcutsTitle">' +
      '<div class="wc-shortcuts-head">' +
      '<strong id="wcShortcutsTitle">快捷键汇总</strong>' +
      '<button type="button" class="wc-shortcuts-close" data-wc-shortcuts-close aria-label="关闭">✕</button>' +
      '</div>' +
      '<div class="wc-shortcuts-body">' + GROUPS.map(groupHtml).join('') + '</div>' +
      '</div>';
    document.body.appendChild(overlay);
    document.body.classList.add('wc-shortcuts-lock');
  }

  function bind() {
    if (bound) return;
    bound = true;
    document.addEventListener('click', function (e) {
      if (e.target.closest(OPEN_SEL)) {
        open();
        return;
      }
      if (e.target.closest('[data-wc-shortcuts-close]') || (e.target.closest(MODAL_SEL) && e.target.hasAttribute('data-wc-shortcuts-modal'))) {
        close();
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') close();
    });
  }

  function boot() {
    injectStyle();
    bind();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
