    inset 1px 1px 0 var(--decor-emboss-inset-hi),

    var(--card-shadow);

    box-shadow 0.3s ease,
    outline-color 0.3s ease,
    outline-offset 0.3s ease,
    transform 0.3s ease;
}

.embossed.large {
  outline: 1px solid var(--decor-emboss-outline);
  outline-offset: 3px;
}

  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  z-index: 2;

    /* TL */
    linear-gradient(var(--decor-corner), var(--decor-corner)) top left / var(--decor-corner-size) 1.5px no-repeat,
    linear-gradient(var(--decor-corner), var(--decor-corner)) top left / 1.5px var(--decor-corner-size) no-repeat,

    linear-gradient(var(--decor-corner), var(--decor-corner)) top right / 1.5px var(--decor-corner-size) no-repeat,

    linear-gradient(var(--decor-corner), var(--decor-corner)) bottom left / 1.5px var(--decor-corner-size) no-repeat,

    linear-gradient(var(--decor-corner), var(--decor-corner)) bottom right / 1.5px var(--decor-corner-size) no-repeat;

.card-export .axis-ornament-top .orn-line{
  width: 15px;
  height: 1px;

}

.card-export .axis-ornament-top .orn-diamond{
  width: 8px;
  height: 8px;
  background: var(--card-primary);

}

.card-export .axis-row{
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  width: 100%;
  max-width: 100%;
  min-width: 0;
}

.card-export .axis-line{
  flex: 1 1 0;
  max-width: 72px;
  min-width: 28px;
  height: 1px;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--card-primary) 50%, transparent), color-mix(in srgb, var(--card-primary) 50%, transparent));
}

.card-export .axis-line.right{
  background: linear-gradient(90deg, color-mix(in srgb, var(--card-primary) 50%, transparent), color-mix(in srgb, var(--card-primary) 50%, transparent), transparent);
}

.card-export .axis-name{
  flex: 0 1 auto;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 6px;
  color: var(--card-text);

  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
  line-height: 1.1;
  text-align: center;
}

.card-export .axis-underline{
  width: 24px;
  height: 1px;
  background: var(--card-primary);
  opacity: 0.15;
  margin-top: 6px;
}

.card-export .header-right{
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  gap: 4px;
  flex-shrink: 0;
  width: 230px;
}

.card-export .plaque-row{
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-export .plaque-code{
  font-family: 'Cinzel', 'Noto Serif SC', serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  color: color-mix(in srgb, var(--card-primary) 75%, transparent);
  white-space: nowrap;
}

/* Art Deco 标签按钮：未选中 / 悬停 / 选中 */
.card-export .tag-plaque{
  position: relative;
  height: 30px;
  padding: 0 10px;
  border-radius: 3px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  font-family: 'Noto Serif SC', serif;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
  box-sizing: border-box;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  /* 未选中：深色底 + 金色描边 + 金色文字 */
  color: var(--card-primary);
  background: color-mix(in srgb, var(--card-bg) 92%, transparent);
  border: 1px solid color-mix(in srgb, var(--card-primary) 42%, transparent);
  outline: 1px solid color-mix(in srgb, var(--card-primary) 12%, transparent);
  outline-offset: 3px;
  box-shadow: none;
  transition: color 0.2s, background 0.2s, border-color 0.2s, outline-color 0.2s, box-shadow 0.2s;
}

.card-export .tag-plaque .tag-diamond{
  width: 6px;
  height: 6px;
  transform: rotate(45deg);
  flex-shrink: 0;
  background: var(--card-primary);
  transition: background 0.2s, box-shadow 0.2s;
}

/* 悬停��未选��������������������提亮 */
.card-export .tag-plaque:hover:not(.is-active){
  color: var(--card-highlight-2);
  border-color: color-mix(in srgb, var(--card-highlight-2) 85%, transparent);
  outline-color: color-mix(in srgb, var(--card-primary) 35%, transparent);
  background: color-mix(in srgb, var(--card-bg) 95%, transparent);
}

.card-export .tag-plaque:hover:not(.is-active) .tag-diamond{
  background: var(--card-highlight-2);
  box-shadow: 0 0 8px color-mix(in srgb, var(--card-primary) 50%, transparent);
}

/* 选中：金色填充 + 黑色文字（与未选中明确区分） */
.card-export .tag-plaque.is-active{
  color: var(--card-bg);
  background: linear-gradient(180deg, var(--card-highlight) 0%, var(--card-primary) 42%, var(--card-shadow-2) 100%);
  border-color: var(--card-highlight-2);
  outline-color: color-mix(in srgb, var(--card-primary) 45%, transparent);
  box-shadow:
    0 0 14px color-mix(in srgb, var(--card-primary) 32%, transparent),
    inset 0 1px 0 color-mix(in srgb, var(--card-highlight) 45%, transparent);
}

.card-export .tag-plaque.is-active .tag-diamond{
  background: var(--card-bg);
  box-shadow: none;
}

.card-export .tag-plaque.is-active:hover{
  color: var(--card-bg);
  filter: brightness(1.06);
}

.card-export .tag-plaque:focus-visible{
  outline: 2px solid var(--card-primary);
  outline-offset: 3px;
}

/* Characters */
.card-export .characters{
  flex: 1;
  display: flex;
  align-items: stretch;
  gap: 0;
  margin-bottom: 6px;
  min-height: 0;
  padding: 16px 4px 14px;
  overflow: visible;
}

.card-export .char-wrapper{
  flex: 1;
  min-width: 0;
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: transform 0.25s ease;
}

.card-export .char-wrapper.is-selected{
  z-index: 4;
}

.card-export .char-slot{
  height: 430px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  flex: 0 0 auto;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.32);
  border: none;
  border-radius: 0;
  position: relative;
  z-index: 5;
  cursor: pointer;
  /* 45° 切角 */
  clip-path: polygon(
    var(--deco-cut) 0,
    calc(100% - var(--deco-cut)) 0,
    100% var(--deco-cut),
    100% calc(100% - var(--deco-cut)),
    calc(100% - var(--deco-cut)) 100%,
    var(--deco-cut) 100%,
    0 calc(100% - var(--deco-cut)),
    0 var(--deco-cut)
  );
  box-shadow:
    inset 0 0 0 1px rgba(0, 0, 0, 0.55),
    inset 0 1px 0 color-mix(in srgb, var(--card-primary) 8%, transparent),
    inset 0 -1px 0 rgba(0, 0, 0, 0.35),
    0 4px 16px rgba(0, 0, 0, 0.3);
  transition: box-shadow 0.25s ease, transform 0.25s ease;
}

.card-export .char-wrapper:hover .char-slot, .card-export .char-slot:hover{
  transform: translateY(-4px);
  box-shadow:
    inset 0 0 0 1px rgba(0, 0, 0, 0.55),
    inset 0 1px 0 color-mix(in srgb, var(--card-highlight-2) 14.000000000000002%, transparent),
    0 10px 28px rgba(0, 0, 0, 0.45),
    0 0 24px color-mix(in srgb, var(--card-primary) 12%, transparent);
}

.card-export .char-wrapper:hover .char-frame{
  filter: brightness(1.1);
}

.card-export .ced-lbl{font-size:12px;color:#c9cfd6;font-weight:600;margin-left:3px;}
.card-export .ced-block-title{font-size:10px;color:#c6c0b2;letter-spacing:2px;font-weight:700;display:flex;align-items:center;gap:7px;margin-top:5px;}

.card-export .char-wrapper.is-selected .char-slot{
  transform: translateY(-4px);
  box-shadow:
    inset 0 0 0 1px rgba(0, 0, 0, 0.5),
    inset 0 1px 0 color-mix(in srgb, var(--card-highlight-2) 18%, transparent),
    0 12px 32px rgba(0, 0, 0, 0.5),
    0 0 28px color-mix(in srgb, var(--card-primary) 18%, transparent);
}

.card-export .char-wrapper.is-selected .char-frame{
  filter: brightness(1.14);
}

.card-export .char-slot:focus-visible{
  outline: 2px solid var(--card-primary);
  outline-offset: 4px;
}

.card-export .char-outer-deco{
  position: absolute;
  inset: -18px;
  z-index: 3;
  pointer-events: none;
}

/* 四角外侧延伸 */
.card-export .outer-corner{
  position: absolute;
  width: 20px;
  height: 20px;
}

.card-export .outer-corner .oh{
  position: absolute;
  width: 15px;
  height: 2px;
  background: color-mix(in srgb, var(--card-primary) 15%, transparent);
}

.card-export .outer-corner .ov{
  position: absolute;
  width: 2px;
  height: 15px;
  background: color-mix(in srgb, var(--card-primary) 15%, transparent);
}

.card-export .outer-corner .od{
  position: absolute;
  width: 4px;
  height: 4px;
  background: color-mix(in srgb, var(--card-primary) 20%, transparent);
  transform: rotate(45deg);
}

.card-export .outer-corner.tl{ top: 0; left: 0; }
.card-export .outer-corner.tl .oh{ top: 15px; left: 0; }
.card-export .outer-corner.tl .ov{ top: 0; left: 15px; }
.card-export .outer-corner.tl .od{ top: -1px; left: -1px; }

.card-export .outer-corner.tr{ top: 0; right: 0; }
.card-export .outer-corner.tr .oh{ top: 15px; right: 0; }
.card-export .outer-corner.tr .ov{ top: 0; right: 15px; }
.card-export .outer-corner.tr .od{ top: -1px; right: -1px; }

.card-export .outer-corner.bl{ bottom: 0; left: 0; }
.card-export .outer-corner.bl .oh{ bottom: 15px; left: 0; }
.card-export .outer-corner.bl .ov{ bottom: 0; left: 15px; }
.card-export .outer-corner.bl .od{ bottom: -1px; left: -1px; }

.card-export .outer-corner.br{ bottom: 0; right: 0; }
.card-export .outer-corner.br .oh{ bottom: 15px; right: 0; }
.card-export .outer-corner.br .ov{ bottom: 0; right: 15px; }
.card-export .outer-corner.br .od{ bottom: -1px; right: -1px; }

.card-export .outer-top-line{

  top: 12px;
  left: 20%;
  right: 20%;

}

.card-export .outer-top-line::after{
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;

}

.card-export .outer-bottom-line{

  right: 30%;

}

.card-export .outer-dot-left, .card-export .outer-dot-right{
  position: absolute;

.card-export .outer-dot-left{ left: 10px; }
.card-export .outer-dot-right{ right: 10px; }

.card-export .char-sep{

.card-export .char-sep::before{

  background:

    linear-gradient(color-mix(in srgb, var(--card-primary) 12%, transparent), color-mix(in srgb, var(--card-primary) 12%, transparent)) center 100% / 1.5px 10px no-repeat;
}

/* 装饰总层：仅空心金属边框（html2canvas 不支持 mask-composite，禁止用渐变铺满） */
.card-export .char-frame{
  position: absolute;
  inset: 0;
  z-index: 50;
  pointer-events: none;
  border: 2px solid var(--card-primary);
  border-image: none;
  border-radius: 0;
  background: transparent !important;
  clip-path: polygon(
    var(--deco-cut) 0,
    calc(100% - var(--deco-cut)) 0,
    100% var(--deco-cut),
    100% calc(100% - var(--deco-cut)),
    calc(100% - var(--deco-cut)) 100%,
    var(--deco-cut) 100%,
    0 calc(100% - var(--deco-cut)),
    0 var(--deco-cut)
  );
  box-shadow:
    inset 0 0 0 1px rgba(0, 0, 0, 0.65),
    inset 0 1px 0 color-mix(in srgb, var(--card-highlight-2) 22%, transparent),
    inset 0 -1px 0 rgba(0, 0, 0, 0.35),
    0 0 0 1px color-mix(in srgb, var(--card-shadow) 35%, transparent);
  outline: none;
  transition: filter 0.25s ease;
}

/* 外层金属高光：改为细线描边，避免导出时整块金底 */
.card-export .char-frame::before{
  content: '';
  position: absolute;
  inset: 0;
  border: 1px solid color-mix(in srgb, var(--card-highlight-2) 35%, transparent);
  box-sizing: border-box;
  background: transparent !important;
  -webkit-mask: none;
  mask: none;
  pointer-events: none;
  clip-path: inherit;
}

/* 内侧暗色压边 */
.card-export .char-frame::after{
  content: '';
  position: absolute;
  inset: 3px;
  border: 1px solid color-mix(in srgb, var(--card-primary) 28.000000000000004%, transparent);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.4);
  background: transparent !important;
  pointer-events: none;
  clip-path: polygon(
    calc(var(--deco-cut) - 4px) 0,
    calc(100% - var(--deco-cut) + 4px) 0,
    100% calc(var(--deco-cut) - 4px),
    100% calc(100% - var(--deco-cut) + 4px),
    calc(100% - var(--deco-cut) + 4px) 100%,
    calc(var(--deco-cut) - 4px) 100%,
    0 calc(100% - var(--deco-cut) + 4px),
    0 calc(var(--deco-cut) - 4px)
  );
}

.card-export .char-wrapper:hover .char-frame, .card-export .char-wrapper.is-selected .char-frame{
  filter: brightness(1.08);
}

.card-export .char-slot:has(.placeholder) .char-frame{
  filter: none;
}

.card-export .char-frame-inset{
  position: absolute;
  inset: 5px;
  border: 1px solid color-mix(in srgb, var(--card-primary) 42%, transparent);
  border-radius: 0;
  background: transparent;
  clip-path: polygon(
    calc(var(--deco-cut) - 3px) 0,
    calc(100% - var(--deco-cut) + 3px) 0,
    100% calc(var(--deco-cut) - 3px),
    100% calc(100% - var(--deco-cut) + 3px),
    calc(100% - var(--deco-cut) + 3px) 100%,
    calc(var(--deco-cut) - 3px) 100%,
    0 calc(100% - var(--deco-cut) + 3px),
    0 calc(var(--deco-cut) - 3px)
  );
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.28);
  pointer-events: none;
}

.card-export .char-frame-inner{
  display: none;
}

.card-export .char-frame-top, .card-export .char-frame-bottom{
  display: none;

/* 整卡外框：四角 L 形金属角标 + 顶部中央菱形 */
.card-export .card-frame{position:absolute;inset:10px;pointer-events:none;z-index:5;}
.card-export .card-frame::before{content:"";position:absolute;inset:0;background:
  linear-gradient(var(--gold-dim),var(--gold-dim)) left 0 top 0 / 22px 3px,
  linear-gradient(var(--gold-dim),var(--gold-dim)) left 0 top 0 / 3px 22px,
  linear-gradient(var(--gold-dim),var(--gold-dim)) right 0 top 0 / 22px 3px,
  linear-gradient(var(--gold-dim),var(--gold-dim)) right 0 top 0 / 3px 22px,
  linear-gradient(var(--gold-dim),var(--gold-dim)) left 0 bottom 0 / 22px 3px,
  linear-gradient(var(--gold-dim),var(--gold-dim)) left 0 bottom 0 / 3px 22px,
  linear-gradient(var(--gold-dim),var(--gold-dim)) right 0 bottom 0 / 22px 3px,
  linear-gradient(var(--gold-dim),var(--gold-dim)) right 0 bottom 0 / 3px 22px;
  background-repeat:no-repeat;opacity:.85;filter:drop-shadow(0 0 4px rgba(229,192,123,0.4));}
.card-export .card-frame::after{content:"";position:absolute;left:50%;top:-4px;transform:translateX(-50%) rotate(45deg);width:9px;height:9px;background:var(--gold-dim);box-shadow:0 0 10px rgba(245,198,0,0.6);}
/* 角色卡外顶部两角斜切三角（元素色，探出卡顶；底部直角不留角标，避免与数据卡衔接重影） */
.card-export .char-wrap::before{content:"";position:absolute;inset:-6px;pointer-events:none;z-index:6;color:#e5c07b;
  background:
    linear-gradient(135deg,currentColor 0 9px,transparent 9px) left -2px top -2px / 20px 20px,
    linear-gradient(225deg,currentColor 0 9px,transparent 9px) right -2px top -2px / 20px 20px;
  background-repeat:no-repeat;opacity:.8;filter:drop-shadow(0 0 5px currentColor);}
.card-export .char-wrap.c-conduct::before{color:#9370db;}
.card-export .char-wrap.c-aero::before{color:#48d1cc;}
.card-export .char-wrap.c-spectro::before{color:#e8c76a;}
/* 数据卡右下角元素色菱形徽记（承接外部设计，不叠角色卡底部） */
.card-export .char-wrap::after{content:"";position:absolute;right:10px;bottom:10px;width:8px;height:8px;transform:rotate(45deg);z-index:4;
  border:1px solid currentColor;opacity:.45;box-shadow:0 0 8px currentColor;}
.card-export .char-wrap.c-conduct::after{color:#9370db;}
.card-export .char-wrap.c-aero::after{color:#48d1cc;}
.card-export .char-wrap.c-spectro::after{color:#e8c76a;}

.card-export .char-art::before{content:"";position:absolute;inset:8px;pointer-events:none;z-index:3;background:

.card-export .char-art::after{content:"";position:absolute;inset:8px;pointer-events:none;z-index:3;background:
  linear-gradient(rgba(229,192,123,0.6),rgba(229,192,123,0.6)) left bottom / 14px 1px,

  };
  const STORAGE_KEY = 'wavecalc-theme';
  const DEFAULT_THEME = 'classic';
  /** 已下线主题 → 新主题 */
  const THEME_ALIASES = {
    'dark-purple': 'ink-wash',
    'pure-white': 'peach-blaze',
    'mist-jade': 'ink-wash',
  };

  function normalizeTheme(theme) {
    const mapped = THEME_ALIASES[theme] || theme;
    return THEMES[mapped] ? mapped : DEFAULT_THEME;
  }

  /** 主题切换柔和过渡：用旧主题背景盖一层再淡出，避免生硬跳变（尊重系统减弱动效） */
  function startThemeFade() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    let veil = document.getElementById('wc-theme-fade');
    if (!veil) {
      veil = document.createElement('div');
      veil.id = 'wc-theme-fade';
      veil.setAttribute('aria-hidden', 'true');
      document.body.appendChild(veil);
    }
    try {
      // 直接读主题背景令牌（html 的 background 简写经 var() 嵌套后计算值不稳定，不能作为遮罩色）
      const cs = getComputedStyle(document.documentElement);
      const themed =
        cs.getPropertyValue('--bg-deepest').trim() ||
        cs.getPropertyValue('--bg').trim();
      veil.style.background = themed || cs.backgroundColor || '';
    } catch (_) {
      veil.style.background = '';
    }
    veil.classList.remove('is-active');
    void veil.offsetWidth;
    veil.classList.add('is-active');
  }

  function applyTheme(theme) {
    const next = normalizeTheme(theme);
    const current = document.documentElement.getAttribute('data-theme');
    if (current && current !== next) startThemeFade();
    document.documentElement.setAttribute('data-theme', next);
    document.querySelectorAll('.theme-btn').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.theme === next);
    });
    return next;
  }

  function persistTheme(theme) {
    try {
      localStorage.setItem(STORAGE_KEY, theme);
    } catch (_) {
      /* ignore quota / private mode */
    }
  }

  function readSavedTheme() {
    try {
      return normalizeTheme(localStorage.getItem(STORAGE_KEY) || DEFAULT_THEME);
    } catch (_) {
      return DEFAULT_THEME;
    }
  }

  function bindSwitcher() {
    document.querySelectorAll('.theme-btn').forEach((btn) => {
      if (btn.dataset.themeBound) return;
      btn.dataset.themeBound = '1';
      btn.addEventListener('click', () => {
        const theme = applyTheme(btn.dataset.theme);
        persistTheme(theme);
      });
    });
  }

  const rawSaved = (() => {
    try {
      return localStorage.getItem(STORAGE_KEY) || DEFAULT_THEME;
    } catch (_) {
      return DEFAULT_THEME;
    }
  })();
  const saved = normalizeTheme(rawSaved);
  applyTheme(saved);
  if (rawSaved !== saved) persistTheme(saved);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bindSwitcher);
  } else {
    bindSwitcher();
  }

  window.WaveCalcTheme = {
    THEMES,
    STORAGE_KEY,
    applyTheme: (theme) => {
      const next = applyTheme(theme);
      persistTheme(next);
      return next;
    },
    getTheme: () =>
      normalizeTheme(document.documentElement.getAttribute('data-theme') || readSavedTheme()),
  };
})();
</script>
<script>
/**
 * 卡面 / 详情弹窗 4 主题切换（暗金 gold / 冰蓝 ice / 赤焰 flame / 翡翠 jade）
 * 独立于页面主题（theme.js），作用于 documentElement 的 data-card-theme 属性。
 */
(function () {
  'use strict';

  var STORAGE_KEY = 'wavecalc-card-theme';
  var THEMES = ['gold', 'ice', 'flame', 'jade'];

  function readSaved() {
    try {
      var t = localStorage.getItem(STORAGE_KEY);
      return THEMES.indexOf(t) >= 0 ? t : 'gold';
    } catch (e) {
      return 'gold';
    }
  }

  function apply(theme) {
    var next = THEMES.indexOf(theme) >= 0 ? theme : 'gold';
    document.documentElement.setAttribute('data-card-theme', next);
    syncButtons();
    return next;
  }

  function syncButtons() {
    var cur = document.documentElement.getAttribute('data-card-theme') || 'gold';
    document.querySelectorAll('[data-card-theme-btn]').forEach(function (b) {
      b.classList.toggle('is-active', b.getAttribute('data-card-theme-btn') === cur);
      b.setAttribute('aria-pressed', b.getAttribute('data-card-theme-btn') === cur ? 'true' : 'false');
    });
    document.querySelectorAll('[data-card-theme-select]').forEach(function (sel) {
      sel.value = cur;
    });
  }

  apply(readSaved());

  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-card-theme-btn]');
    if (!btn) return;
    var t = btn.getAttribute('data-card-theme-btn');
    apply(t);
    try {
      localStorage.setItem(STORAGE_KEY, t);
    } catch (err) {
      /* ignore */
    }
  });

  document.addEventListener('change', function (e) {
    var sel = e.target.closest('[data-card-theme-select]');
    if (!sel) return;
    var t = sel.value;
    apply(t);
    try {
      localStorage.setItem(STORAGE_KEY, t);
    } catch (err) {
      /* ignore */
    }
  });

  window.WaveCalcCardTheme = {
    apply: function (t) {
      apply(t);
      try {
        localStorage.setItem(STORAGE_KEY, t);
      } catch (err) {
        /* ignore */
      }
    },
    get: function () {
      return document.documentElement.getAttribute('data-card-theme') || 'gold';
    },
  };
})();

  <script>
/**
 * 声骸副词条收益模拟（独立预览，不写回 echoConfig / 不重跑轴）
 * 依赖：ECHO_SUB_AFFIXES、ECHO_SUB_TYPE_DAMAGE_TYPES 等已由 core.js 加载
 *
 * 注意：core 里这些表是顶层 const，不会挂到 window 上；
 * 必须用词法作用域里的 ECHO_SUB_AFFIXES，不能写 global.ECHO_SUB_AFFIXES。
 */
(function (global) {
  'use strict';

  const MARGIN_STEP = 1; // 百分点（与项目单位一致）

  function getEchoSubAffixes() {
    // 优先词法全局（classic script 的 const），其次 window（若有人挂过）
    if (typeof ECHO_SUB_AFFIXES !== 'undefined' && ECHO_SUB_AFFIXES) return ECHO_SUB_AFFIXES;
    return global.ECHO_SUB_AFFIXES || {};
  }

  function getEchoSubTypeDamageTypes() {
    if (typeof ECHO_SUB_TYPE_DAMAGE_TYPES !== 'undefined' && ECHO_SUB_TYPE_DAMAGE_TYPES) {
      return ECHO_SUB_TYPE_DAMAGE_TYPES;
    }
    return global.ECHO_SUB_TYPE_DAMAGE_TYPES || ['普攻', '重击', '共鸣技能', '共鸣解放'];
  }

  function clamp(n, lo, hi) {
    const x = Number(n);
    if (!Number.isFinite(x)) return lo;
    return Math.max(lo, Math.min(hi, x));
  }

  function critExpectFromPct(critRatePct, critDmgPct) {
    const cr = clamp(critRatePct, 0, 100) / 100;
    const cd = Math.max(0, Number(critDmgPct) || 0) / 100;
    return (1 - cr) + cr * cd;
  }

  function deepCloneJson(v) {
    return JSON.parse(JSON.stringify(v));
  }

  /** 克隆面板时保留 erConverts（含函数，不能 JSON 序列化） */
  function clonePanel(panel) {
    const erConverts = panel?.erConverts;
    const p = deepCloneJson({ ...panel, erConverts: undefined });
    p.erConverts = erConverts || [];
    return p;
  }

  function accumulateSubNonType(panel, sub, sign) {
    const def = getEchoSubAffixes()[sub.id];
    if (!def || def.panelTarget === 'type_dmg') return;
    accumulateSubIntoPanel(panel, sub, sign);
  }

  function accumulateSubTypeOnly(panel, sub, sign) {
    const def = getEchoSubAffixes()[sub.id];
    if (!def || def.panelTarget !== 'type_dmg') return;
    accumulateSubIntoPanel(panel, sub, sign);
  }

  function listEchoSubsFromConfig(echoConfig) {
    const out = [];
    const slots = Array.isArray(echoConfig?.slots) ? echoConfig.slots : [];
    slots.forEach((slot, slotIndex) => {
      (slot?.subs || []).forEach((sub, subIndex) => {
        out.push({
          key: `${slotIndex}:${subIndex}`,
          slotIndex,
          subIndex,
          cost: Number(slot?.cost) || 0,
          id: String(sub?.id || ''),
          value: Number(sub?.value) || 0,
          damageType: String(sub?.damageType || ''),
        });
      });
    });
    return out;
  }

  /** 仅主词条1（不含固定不变的主词条2） */
  function listEchoMains1FromConfig(echoConfig) {
    const out = [];
    const slots = Array.isArray(echoConfig?.slots) ? echoConfig.slots : [];
    const getOpt =
      typeof global.getEchoMain1Option === 'function'
        ? global.getEchoMain1Option
        : (cost, id) => {
            const table =
              typeof ECHO_MAIN1_OPTIONS !== 'undefined' ? ECHO_MAIN1_OPTIONS : global.ECHO_MAIN1_OPTIONS;
            const options = (table && table[cost]) || [];
            return options.find((o) => o.id === id) || options[0] || null;
          };
    const elements =
      typeof ECHO_ELEMENTS !== 'undefined' ? ECHO_ELEMENTS : global.ECHO_ELEMENTS || [];
    slots.forEach((slot, slotIndex) => {
      const cost = Number(slot?.cost) || 0;
      const opt = getOpt(cost, slot?.main1);
      if (!opt) return;
      const element = opt.needsElement
        ? String(slot?.main1Element || elements[0] || '')
        : '';
      out.push({
        key: `main1:${slotIndex}`,
        slotIndex,
        cost,
        id: String(opt.id || slot?.main1 || ''),
        value: Number(opt.value) || 0,
        panelTarget: String(opt.panelTarget || ''),
        element,
        label: opt.needsElement && element ? `${element}伤害加成` : String(opt.label || opt.id),
        needsElement: !!opt.needsElement,
      });
    });
    return out;
  }

  function emptyTypeMap() {
    const m = Object.create(null);
    getEchoSubTypeDamageTypes().forEach((t) => {
      m[t] = 0;
    });
    return m;
  }

  function accumulateMain1IntoPanel(panel, main, sign) {
    const s = sign < 0 ? -1 : 1;
    const v = (Number(main?.value) || 0) * s;
    if (!v) return;
    const target = String(main?.panelTarget || '');
    switch (target) {
      case 'atk_percent':
        panel.atkPercent = (Number(panel.atkPercent) || 0) + v;
        break;
      case 'hp_percent':
        panel.hpPercent = (Number(panel.hpPercent) || 0) + v;
        break;
      case 'def_percent':
        panel.defPercent = (Number(panel.defPercent) || 0) + v;
        break;
      case 'crit_rate':
        panel.critRatePct = (Number(panel.critRatePct) || 0) + v;
        break;
      case 'crit_dmg':
        panel.critDmgPct = (Number(panel.critDmgPct) || 0) + v;
        break;
      case 'energy_regen_pct':
        panel.energyRegenPct = (Number(panel.energyRegenPct) || 0) + v;
        break;
      case 'element_dmg': {
        // 仅当属性与角色一致时计入；差分用 elementBonusPct（基准已含当前主1）
        const el = String(main?.element || '');
        const memberEl = String(panel.memberElement || '');
        if (el && memberEl && el !== memberEl) break;
        panel.elementBonusPct = (Number(panel.elementBonusPct) || 0) + v;
        break;
      }
      case 'display_only':
      default:
        break;
    }
  }

  function accumulateSubIntoPanel(panel, sub, sign) {
    const s = sign < 0 ? -1 : 1;
    const def = getEchoSubAffixes()[sub.id];
    if (!def) return;
    const v = (Number(sub.value) || 0) * s;
    switch (def.panelTarget) {
      case 'atk_percent':
        panel.atkPercent += v;
        break;
      case 'flat_atk':
        panel.flatAtk += v;
        break;
      case 'hp_percent':
        panel.hpPercent += v;
        break;
      case 'flat_hp':
        panel.flatHp += v;
        break;
      case 'def_percent':
        panel.defPercent += v;
        break;
      case 'flat_def':
        panel.flatDef += v;
        break;
      case 'crit_rate':
        panel.critRatePct += v;
        break;
      case 'crit_dmg':
        panel.critDmgPct += v;
        break;
      case 'energy_regen_pct':
        panel.energyRegenPct += v;
        break;
      case 'type_dmg': {
        const dt = def.needsDamageType ? String(sub.damageType || '') : String(def.damageType || '');
        if (!dt) break;
        if (!panel.typeSubPct[dt]) panel.typeSubPct[dt] = 0;
        panel.typeSubPct[dt] += v;
        break;
      }
      default:
        break;
    }
  }

  function applyErConvertsFromBase(panel, baseEr) {
    const p = clonePanel(panel);
    const er = Number(p.energyRegenPct) || 0;
    const base = Number(baseEr);
    const baseErSafe = Number.isFinite(base) ? base : er;
    (panel.erConverts || []).forEach((conv) => {
      if (typeof conv?.compute !== 'function') return;
      const oldOut = conv.compute(baseErSafe) || {};
      const newOut = conv.compute(er) || {};
      const keys = new Set([...Object.keys(oldOut), ...Object.keys(newOut)]);
      keys.forEach((k) => {
        const delta = (Number(newOut[k]) || 0) - (Number(oldOut[k]) || 0);
        if (!delta) return;
        if (k === 'critRatePct' || k === 'critRate') p.critRatePct = (Number(p.critRatePct) || 0) + delta;
        else if (k === 'critDmgPct' || k === 'critDmg') p.critDmgPct = (Number(p.critDmgPct) || 0) + delta;
        else if (k === 'atkPercent') p.atkPercent = (Number(p.atkPercent) || 0) + delta;
        else if (k === 'flatAtk') p.flatAtk = (Number(p.flatAtk) || 0) + delta;
        else if (k === 'generalBonusPct') p.generalBonusPct = (Number(p.generalBonusPct) || 0) + delta;
      });
    });
    return p;
  }

  function scaleStatValue(panel, kind) {
    if (kind === 'hp') {
      return (Number(panel.whiteHp) || 0) * (1 + (Number(panel.hpPercent) || 0) / 100) + (Number(panel.flatHp) || 0);
    }
    if (kind === 'def') {
      return (Number(panel.whiteDef) || 0) * (1 + (Number(panel.defPercent) || 0) / 100) + (Number(panel.flatDef) || 0);
    }
    return (
      ((Number(panel.whiteAtk) || 0) + (Number(panel.weaponAtk) || 0)) *
        (1 + (Number(panel.atkPercent) || 0) / 100) +
      (Number(panel.flatAtk) || 0)
    );
  }

  function weightedScale(panel) {
    const w = panel.scaleWeights || { atk: 1, hp: 0, def: 0 };
    const atkW = Number(w.atk) || 0;
    const hpW = Number(w.hp) || 0;
    const defW = Number(w.def) || 0;
    const sumW = atkW + hpW + defW;
    if (!(sumW > 0)) return scaleStatValue(panel, 'atk') || 1;
    return (
      (atkW * scaleStatValue(panel, 'atk') +
        hpW * scaleStatValue(panel, 'hp') +
        defW * scaleStatValue(panel, 'def')) /
      sumW
    );
  }

  function weightedBonusFactor(basePanel, newPanel) {
    const types = Object.keys(basePanel.typeWeights || {});
    let oldSum = 0;
    let newSum = 0;
    let wSum = 0;
    types.forEach((t) => {
      const w = Number(basePanel.typeWeights[t]) || 0;
      if (!(w > 0)) return;
      wSum += w;
      const avg = Number(basePanel.typeAvgDmgBonus[t]) || 1;
      const oldSub = Number(basePanel.typeSubPct[t]) || 0;
      const newSub = Number(newPanel.typeSubPct[t]) || 0;
      const delta = (newSub - oldSub) / 100;
      const generalDelta = ((Number(newPanel.generalBonusPct) || 0) - (Number(basePanel.generalBonusPct) || 0)) / 100;
      const elementDelta = ((Number(newPanel.elementBonusPct) || 0) - (Number(basePanel.elementBonusPct) || 0)) / 100;
      const oldB = avg;
      const newB = Math.max(0.01, avg + delta + generalDelta + elementDelta);
      oldSum += w * oldB;
      newSum += w * newB;
    });
    if (!(wSum > 0) || !(oldSum > 0)) {
      const g =
        (1 + (Number(newPanel.generalBonusPct) || 0) / 100) /
        (1 + (Number(basePanel.generalBonusPct) || 0) / 100);
      return Number.isFinite(g) && g > 0 ? g : 1;
    }
    return newSum / oldSum;
  }

  function estimateDamage(basePanel, candidatePanel) {
    const baseEr = Number(basePanel.energyRegenPct) || 0;
    const effectiveBase = applyErConvertsFromBase(basePanel, baseEr);
    const effectiveNew = applyErConvertsFromBase(candidatePanel, baseEr);

    const panelScaleOld = weightedScale(effectiveBase) || 1;
    const panelScaleNew = weightedScale(effectiveNew) || 1;

    // 攻击/生命/防御基准优先取伤害 breakdown 里的有效数值（含队伍/武器/声骸/全队 Buff），
    // 避免把词条收益按“无 Buff 面板”高估；混合倍率角色按伤害占比加权各倍率基准的比值。
    const es = basePanel.effectiveScale;
    const sw = basePanel.scaleWeights || { atk: 1, hp: 0, def: 0 };
    const swSum = (Number(sw.atk) || 0) + (Number(sw.hp) || 0) + (Number(sw.def) || 0);
    let scaleFactor = 0;
    let scaleOk = false;
    if (es && swSum > 0) {
      const kinds = ['atk', 'hp', 'def'];
      let acc = 0;
      let valid = true;
      kinds.forEach((k) => {
        const w = Number(sw[k]) || 0;
        if (!(w > 0)) return;
        const effOld = Number(es[k]) || 0;
        if (!(effOld > 0)) {
          valid = false;
          return;
        }
        const delta = scaleStatValue(effectiveNew, k) - scaleStatValue(effectiveBase, k);
        acc += (w / swSum) * ((effOld + delta) / effOld);
      });
      if (valid && acc > 0) {
        scaleFactor = acc;
        scaleOk = true;
      }
    }
    if (!scaleOk) scaleFactor = panelScaleNew / panelScaleOld;

    // 暴击期望按段重算：每段原始暴击率 + 差分后逐段封顶 100%（含暴击固定与奥古斯塔转模），
    // 与引擎逐段口径一致，避免「平均暴击率线性差分」在高暴击/溢出场景下翻转结论
    const critFromUnits = (units, dCr, dCd) => {
      let acc = 0;
      let w = 0;
      (units || []).forEach((u) => {
        let cr = u.crFixed ? Number(u.crRaw) : Math.max(0, Number(u.crRaw) + dCr);
        let cd = Math.max(0, Number(u.cdPct) + dCd);
        if (u.augusta && typeof global.computeAugustaCritConversion === 'function') {
          const conv = global.computeAugustaCritConversion(
            Math.max(0, Number(u.augusta.rawCr) + dCr),
            Math.max(0, Number(u.augusta.baseCd) + dCd),
            u.augusta.mech,
            u.augusta.chain
          );
          cr = conv.effectiveCritRatePct;
          cd = conv.effectiveCritDmgPct;
        }
        cr = clamp(cr, 0, 100);
        acc += u.dmg * (1 - cr / 100 + (cr / 100) * (cd / 100));
        w += u.dmg;
      });
      return w > 0 ? acc / w : 1;
    };
    let critOld = 1;
    let critNew = 1;
    if (Array.isArray(basePanel.critUnits) && basePanel.critUnits.length) {
      const deltaCr = (Number(effectiveNew.critRatePct) || 0) - (Number(effectiveBase.critRatePct) || 0);
      const deltaCd = (Number(effectiveNew.critDmgPct) || 0) - (Number(effectiveBase.critDmgPct) || 0);
      critOld = critFromUnits(basePanel.critUnits, 0, 0);
      critNew = critFromUnits(basePanel.critUnits, deltaCr, deltaCd);
    } else {
      critOld = critExpectFromPct(effectiveBase.critRatePct, effectiveBase.critDmgPct) || 1;
      critNew = critExpectFromPct(effectiveNew.critRatePct, effectiveNew.critDmgPct) || 1;
    }
    const critFactor = critNew / critOld;

    const bonusFactor = weightedBonusFactor(effectiveBase, effectiveNew);

    const baseDmg = Number(basePanel.baseDamage) || 0;
    const est = baseDmg * scaleFactor * critFactor * bonusFactor;
    return {
      damage: est,
      scaleFactor,
      critFactor,
      bonusFactor,
      panel: effectiveNew,
      critExpect: critNew,
      critRatePct: clamp(effectiveNew.critRatePct, 0, 100),
      critDmgPct: Math.max(0, effectiveNew.critDmgPct),
    };
  }

  function buildPanelFromSubs(basePanel, subs, mains) {
    const p = clonePanel(basePanel);
    if (p.elementBonusPct == null) p.elementBonusPct = 0;
    // 非类型：从「已含当前词条」的面板减旧加新
    (basePanel._baselineSubs || []).forEach((sub) => accumulateSubNonType(p, sub, -1));
    (subs || []).forEach((sub) => accumulateSubNonType(p, sub, 1));
    // 主词条1差分（不含主词条2固定攻/生命）
    (basePanel._baselineMains || []).forEach((m) => accumulateMain1IntoPanel(p, m, -1));
    (mains || basePanel._baselineMains || []).forEach((m) => accumulateMain1IntoPanel(p, m, 1));
    // 类型增伤：按新词条重算贡献（快照里 typeSubPct 仅来自副词条）
    p.typeSubPct = emptyTypeMap();
    Object.keys(basePanel.typeSubPct || {}).forEach((k) => {
      if (p.typeSubPct[k] == null) p.typeSubPct[k] = 0;
    });
    (subs || []).forEach((sub) => accumulateSubTypeOnly(p, sub, 1));
    return p;
  }

  function calc(input) {
    const basePanel = input.basePanel;
    const subs = input.subs || basePanel._baselineSubs || [];
    const mains = input.mains || basePanel._baselineMains || [];
    const panel = buildPanelFromSubs(basePanel, subs, mains);
    const est = estimateDamage(basePanel, panel);
    const damage = est.damage;
    const baseDmg = Number(basePanel.baseDamage) || 0;
    // 特殊技能伤害不吃声骸词条：作为恒定项计入收益基数，避免词条收益被高估
    const specialDmg = Math.max(0, Number(basePanel.specialDamage) || 0);
    const totalDamage = damage + specialDmg;
    const score = baseDmg > 0 ? (damage / baseDmg) * 100 : 100;

    const noEchoDmg = estimateDamage(basePanel, noEchoPanel).damage;
    // 声骸副词条收益：基准 = 保留主词条、去掉所有副词条后的估算伤害
    const noSubsPanel = buildPanelFromSubs(basePanel, [], basePanel._baselineMains || []);
    const noSubsDmg = estimateDamage(basePanel, noSubsPanel).damage;

    const margins = {};
    const marginKeys = [
      ['atkPercent', '攻击%'],
      ['critRatePct', '暴击率'],
      ['critDmgPct', '暴伤'],
      ['hpPercent', '生命%'],
      ['defPercent', '防御%'],
      ['energyRegenPct', '共鸣效率'],
      ['flatAtk', '固定攻击'],
    ];
    marginKeys.forEach(([key, label]) => {
      const bumped = clonePanel(panel);
      bumped[key] = (Number(bumped[key]) || 0) + MARGIN_STEP;
      const mEst = estimateDamage(basePanel, bumped);
      const lift = totalDamage > 0 ? ((mEst.damage - damage) / totalDamage) * 100 : 0;
      margins[key] = { label, step: MARGIN_STEP, liftPct: lift };

      const mEst = estimateDamage(basePanel, bumped);

      typeMargins[t] = { label: `${t}增伤`, step: MARGIN_STEP, liftPct: lift };
    });

      damage,
      baseDamage: baseDmg,
      score,
      changePct: baseDmg + specialDmg > 0 ? ((damage - baseDmg) / (baseDmg + specialDmg)) * 100 : 0,
      noEchoDamage: noEchoDmg,
      noSubsDamage: noSubsDmg,
      specialDamage: specialDmg,
      totalDamage,
      totalBaseDamage: baseDmg + specialDmg,
      noEchoTotal: noEchoDmg + specialDmg,
      noSubsTotal: noSubsDmg + specialDmg,
      echoTotalGainPct: noEchoDmg + specialDmg > 0 ? (totalDamage / (noEchoDmg + specialDmg) - 1) * 100 : 0,
      subOnlyGainPct: noSubsDmg + specialDmg > 0 ? (totalDamage / (noSubsDmg + specialDmg) - 1) * 100 : 0,
      panel: {

        flatAtk: panel.flatAtk,
        hpPercent: panel.hpPercent,
        flatHp: panel.flatHp,
        defPercent: panel.defPercent,
        flatDef: panel.flatDef,
        critRatePct: clamp(est.critRatePct, 0, 100),

        elementBonusPct: Number(panel.elementBonusPct) || 0,
        typeSubPct: panel.typeSubPct,

      margins,
      typeMargins,
      message: Math.abs(damage - baseDmg) < 1e-6 ? '相对当前配置无变化' : '',

  }

  function replace(input, ops) {
    const subs = deepCloneJson(input.subs || input.basePanel._baselineSubs || []);
    const mains = deepCloneJson(input.mains || input.basePanel._baselineMains || []);
    const before = calc({ ...input, subs, mains });
    (ops || []).forEach((op) => {
      if (op?.kind === 'main1') {
        const si = Number(op.slotIndex);
        const m = mains.find((x) => x.slotIndex === si);
        if (!m) return;
        if (op.id != null) m.id = String(op.id);
        if (op.value != null) m.value = Number(op.value) || 0;
        if (op.panelTarget != null) m.panelTarget = String(op.panelTarget);
        if (op.element != null) m.element = String(op.element || '');
        if (op.label != null) m.label = String(op.label);
        if (op.needsElement != null) m.needsElement = !!op.needsElement;
        return;
      }
      const idx = Number(op.index);
      if (!Number.isInteger(idx) || idx < 0 || idx >= subs.length) return;
      if (op.id != null) subs[idx].id = String(op.id);
      if (op.value != null) subs[idx].value = Number(op.value) || 0;
      if (op.damageType != null) subs[idx].damageType = String(op.damageType || '');
    });
    const after = calc({ ...input, subs, mains });
    const changePct =
      before.totalDamage > 0 ? ((after.totalDamage - before.totalDamage) / before.totalDamage) * 100 : 0;
    return {
      before,
      after,
      changePct,
      subs,
      mains,
      message: Math.abs(changePct) < 1e-9 ? '替换后伤害无变化' : '',
    };
  }

      const idx = members.indexOf(member);

      const cycles = st?.specialSkills?.results?.cycles;
      if (!Array.isArray(cycles)) return 0;
      let total = 0;
      cycles.forEach((cyc) => {
        (Array.isArray(cyc?.items) ? cyc.items : []).forEach((it) => {

      midY: anchorRect.midY,
    };

    const canTop = trigger.top - tipH - GAP >= VIEW_PAD;
    const canBottom = trigger.bottom + GAP + tipH <= vh - VIEW_PAD;
    const canRight = trigger.right + GAP + tipW <= vw - VIEW_PAD;
    const canLeft = trigger.left - tipW - GAP >= VIEW_PAD;

    let order = ['top', 'bottom', 'right', 'left'];
    if (preferred && preferred !== 'auto') {
      order = [preferred, ...order.filter((p) => p !== preferred)];
    }

    const fits = { top: canTop, bottom: canBottom, right: canRight, left: canLeft };
    let placement = order.find((p) => fits[p]) || 'top';

    let left = 0;
    let top = 0;

    if (placement === 'top') {
      top = trigger.top - tipH - GAP;
      left = trigger.left + (trigger.width - tipW) / 2;
      left = Math.max(VIEW_PAD, Math.min(left, vw - tipW - VIEW_PAD));
    } else if (placement === 'bottom') {
      top = trigger.bottom + GAP;
      left = trigger.left + (trigger.width - tipW) / 2;
      left = Math.max(VIEW_PAD, Math.min(left, vw - tipW - VIEW_PAD));
    } else if (placement === 'right') {
      left = trigger.right + GAP;
      top = trigger.top + (trigger.height - tipH) / 2;
      top = Math.max(VIEW_PAD, Math.min(top, vh - tipH - VIEW_PAD));
    } else {
      left = trigger.left - tipW - GAP;
      top = trigger.top + (trigger.height - tipH) / 2;
      top = Math.max(VIEW_PAD, Math.min(top, vh - tipH - VIEW_PAD));
    }

    // 极端视口：仍保证不溢出
    left = Math.max(VIEW_PAD, Math.min(left, Math.max(VIEW_PAD, vw - tipW - VIEW_PAD)));
    top = Math.max(VIEW_PAD, Math.min(top, Math.max(VIEW_PAD, vh - tipH - VIEW_PAD)));

    el.dataset.placement = placement;
    el.style.left = `${Math.round(left)}px`;
    el.style.top = `${Math.round(top)}px`;

    const arrow = el.querySelector('.wc-tooltip-arrow');
    if (arrow) {
      arrow.style.left = '';
      arrow.style.top = '';
      arrow.style.right = '';
      arrow.style.bottom = '';
      if (placement === 'top' || placement === 'bottom') {
        const ax = trigger.midX - left;
        arrow.style.left = `${Math.round(Math.min(tipW - 12, Math.max(12, ax)))}px`;
      } else {
        const ay = trigger.midY - top;
        arrow.style.top = `${Math.round(Math.min(tipH - 12, Math.max(12, ay)))}px`;
      }
    }

    return placement;
  }

  function bindViewportListenersOnce() {
    if (viewportListenersBound || typeof window === 'undefined') return;
    viewportListenersBound = true;
    const onViewportChange = () => {
      if (!isVisible()) return;

  function hideImmediate() {
    clearShowTimer();
    clearHideAnimTimer();
    currentToken += 1;
    activeAnchor = null;
    const el = rootEl || document.getElementById('wcTooltipRoot');
    if (!el) return;
    el.classList.remove('closing');
    el.hidden = true;
    el.style.left = '';
    el.style.top = '';
  }

  function hide(immediate) {
    clearShowTimer();
    const el = rootEl || document.getElementById('wcTooltipRoot');
    if (!el || el.hidden) {
      activeAnchor = null;
      return;
    }
    if (immediate) {
      hideImmediate();
      return;
    }
    clearHideAnimTimer();
    el.classList.add('closing');
    const token = currentToken;
    hideAnimTimer = setTimeout(() => {
      hideAnimTimer = null;
      if (token !== currentToken) return;
      hideImmediate();
    }, HIDE_OUT_MS);
  }

  function showNow(anchor, content, options = {}) {
    clearShowTimer();
    clearHideAnimTimer();
    currentToken += 1;
    const token = currentToken;
    bindViewportListenersOnce();
    const el = ensureRoot();
    const inner = el.querySelector('.wc-tooltip-inner');
    if (inner) inner.innerHTML = buildInnerHtml(content);

    const variant = options.variant || content?.variant || 'default';
    el.dataset.variant = variant;
    el.classList.remove('closing');
    el.hidden = false;
    el.style.visibility = 'hidden';

    activeAnchor = anchor || null;
    const rect = getAnchorRect(anchor, options.pointerEvent);
    placeTooltip(el, rect, options.placement || 'auto');

    el.style.visibility = '';
    // 重触发入场动画
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';

    if (token !== currentToken) return;
  }

  function show(anchor, content, options = {}) {
    const delay = options.delay == null ? 0 : Number(options.delay);
    clearShowTimer();
    // 新的打开时旧的立即关掉（无退场动画）
    hideImmediate();
    if (delay > 0) {
      showTimer = setTimeout(() => {
        showTimer = null;
        showNow(anchor, content, options);
      }, delay);
      return;
    }
    showNow(anchor, content, options);
  }

  function scheduleShow(anchor, content, options = {}) {
    show(anchor, content, { ...options, delay: options.delay == null ? SHOW_DELAY_MS : options.delay });
  }

  function isVisible() {
    const el = rootEl || document.getElementById('wcTooltipRoot');
    return !!(el && !el.hidden);
  }

  function getActiveAnchor() {
    return activeAnchor;
  }

  const api = {
    SHOW_DELAY_MS,
    show,
    scheduleShow,
    hide,
    hideImmediate,
    isVisible,
    getActiveAnchor,
    buildInnerHtml,
    formatBuffDescHtml,
    esc,
  };

  global.WcTooltip = api;

<script>

(function () {

      var refreshed = await refreshSession();

      if (pendingApiGets[mergeKey]) return pendingApiGets[mergeKey];

    var attempt = async function (tk) {
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, method === 'GET' ? API_TIMEOUT_MS : API_WRITE_TIMEOUT_MS);
      apiControllers.push(controller);
      var attemptStart = Date.now();
      try {
        var body = opts.body !== undefined ? JSON.stringify(opts.body) : undefined;
        var headers = Object.assign(
          { 'Content-Type': 'application/json' },

        // 大请求体（上传/草稿/方案更新）gzip 压缩：体积约 1/10，传输快 10 倍；
        // 服务器 express.json 默认自动解压。压缩失败自动回退明文。
        if (
          typeof body === 'string' &&
          body.length > 64 * 1024 &&
          typeof CompressionStream === 'function' &&
          typeof Blob !== 'undefined' &&
          typeof Response !== 'undefined'

            method: method,

  var overlayEl = null;

      '</nav>' +

      if (signupBtn) { void doSignup(); return; }

      if (logoutBtn) { void doLogout(); return; }

  }
  function closeCloud() {
    if (overlayEl) { overlayEl.remove(); overlayEl = null; }

  function tabStyle(tab) {

  function renderLibrary() {

      '<div style="display:flex;gap:8px;margin-bottom:12px">' +
      '<input data-cloud-q type="text" placeholder="搜索标题或分享码" value="' + esc(currentQuery || '') + '" style="flex:1;padding:8px 10px;border-radius:8px;border:1px solid #384055;background:#141824;color:#e8ecf5" />' +

  async function importFromCode(code) {
    if (typeof window.parseSchemeImport !== 'function' || typeof window.importWorkspaceFromData !== 'function') {
      setStatus('导入函数未就绪', true);
      return;
    }
    try {
      setStatus('下载方案中…');
      var detail = await api('/schemes/' + encodeURIComponent(code));
      var payload = detail.payload;
      if (!payload) throw new Error('方案无数据');
      var parsed = parseSchemeImport(payload);
      if (parsed.type !== 'scheme') throw new Error('该方案不是完整工作区格式');
      await importWorkspaceFromData(parsed.data, parsed.meta || { name: detail.title });
      // 导入自己的方案：记住来源分享码，重新上传走「覆盖更新」；导入他人方案则清空，避免误覆盖
      var importedShareCode = '';
      try {
        var me = typeof getUser === 'function' ? getUser() : null;
        var authorId = detail && detail.profiles && detail.profiles.id;
        if (me && authorId && String(authorId) === String(me.id)) importedShareCode = String(code || '');
      } catch (e) { /* 忽略 */ }
      if (importedShareCode && /^MC-[A-Z0-9]{6}$/i.test(importedShareCode)) {
        if (!state.exportCardDraft) state.exportCardDraft = {};
        state.exportCardDraft.shareCode = importedShareCode;
        if (typeof window.scheduleSave === 'function') scheduleSave();
      } else if (state.exportCardDraft) {
        state.exportCardDraft.shareCode = '（网页上线后生成）';
      }
      setStatus('已导入「' + detail.title + '」到工作区');
      closeCloud();
    } catch (err) {
      setStatus('导入失败：' + err.message, true);
    }
  }
  function copyText(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { setStatus('已复制 ' + text); }, function () { setStatus('复制失败', true); });
      } else {
        var ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
        setStatus('已复制 ' + text);
      }
    } catch (e) { setStatus('复制失败', true); }
  }

      tags: tags,

    };
  }
  async function buildUploadBody(fieldOverride, extra) {
    if (typeof window.assertNoCustomCharactersForPublicUpload === 'function') {
      assertNoCustomCharactersForPublicUpload();
    }
    // Batch A（P0-5）：公开上传前预检测试服（CSF）角色/武器（仅 9xxx 临时段拦截；1212 景燃 / 21010076 千般渡 / 清宵 1413 / 云琅 21020106 已批准上线勿拦）
    if (typeof state !== 'undefined' && Array.isArray(state.members)) {
      var csfBad = state.members.some(function (m) {
        var cid = String(m && m.characterId || '').trim();
        var wid = String(m && (m.weaponSelection && m.weaponSelection.id || m.weaponId) || '').trim();
        return /^9\d{3}$/.test(cid);
      });
      if (csfBad) throw new Error('公开库不允许上传测试服（CSF）角色/武器方案');
    }
    if (typeof window.buildWorkspacePayload !== 'function') throw new Error('工作区打包函数未就绪');
    var fields = collectUploadFields(fieldOverride || null);
    var summary = null;
    try {
      // 上传前强制现算：summary 与注入的 results 必须来自本次计算，杜绝过期客户端快照
      if (typeof window.buildExportSummary === 'function') summary = buildExportSummary({ skipCompute: false });
    } catch (e) {
      throw new Error('计算未完成，请先完成一次计算后再上传');
    }
    if (summary) {
      fields.meta.summary = summary;
      fields.summary = summary;
    }
    var payload = { meta: fields.meta, data: buildWorkspacePayload() };
    // Batch B（P0-3）：上传前快照行一致性门禁 + B+ 旧数据自动重算（只改打包副本，不动本地 state）
    var UPLOAD_SNAP_STALE_TOLERANCE = 0.001; // 0.1%
    if (payload && payload.data && Array.isArray(payload.data.exportConfigSnapshots)) {
      var cfgRows = payload.data.exportConfigSnapshots
        .filter(function (s) { return s && s.included !== false; })
        .map(function (s) { return JSON.parse(JSON.stringify(s)); });
      var recalcRow = typeof window.recalcExportCfgV2Row === 'function' ? window.recalcExportCfgV2Row : null;
      var staleRows = [];
      var unverifiableRows = [];
      cfgRows.forEach(function (row) {
        if (!recalcRow) { unverifiableRows.push(row); return; }
        try {
          var fresh = recalcRow(row);
          if (!fresh || !Number.isFinite(Number(fresh.teamDps))) { unverifiableRows.push(row); return; }
          if (row._staleImported === true) {
            row.teamTotal = Number(fresh.teamTotal) || 0;
            row.teamDps = Number(fresh.teamDps) || 0;
            row.axisDuration = Number(fresh.axisDuration) || 0;
            row.specialTotal = Number(fresh.specialTotal) || 0;
            if (Array.isArray(fresh.specialItems)) row.specialItems = fresh.specialItems;
            if (Array.isArray(fresh.members)) row.members = fresh.members;
            delete row._staleImported;
            return;
          }
          var storedDps = Number(row.teamDps) || 0;
          var freshDps = Number(fresh.teamDps) || 0;
          if (storedDps > 0 && Math.abs(freshDps - storedDps) / storedDps > UPLOAD_SNAP_STALE_TOLERANCE) {
            staleRows.push(row);
          }
        } catch (e) {
          unverifiableRows.push(row);
        }
      });
      if (staleRows.length || unverifiableRows.length) {
        var staleChoice = await confirmStaleImportUpload({
          count: staleRows.length + unverifiableRows.length,
          total: cfgRows.length,
          labels: staleRows.concat(unverifiableRows).slice(0, 3).map(function (r) { return r.label || r.fingerprint || '未命名配置'; }),
        });
        if (staleChoice === 'recalc') {
          if (typeof window.syncExportConfigSnapshotsFromIndex === 'function') {
            await window.syncExportConfigSnapshotsFromIndex(0);
          }
          return buildUploadBody(fieldOverride, extra);
        }
        if (staleChoice === 'drop') {
          var dropIds = new Set(staleRows.concat(unverifiableRows).map(function (r) { return r.id; }));
          cfgRows = cfgRows.filter(function (r) { return !dropIds.has(r.id); });
          payload.data.exportConfigSnapshots = cfgRows;
        }
        if (staleChoice === null) {
          throw new Error('已取消上传');
        }
        if (staleChoice === 'keep') {
          if (fields.meta.summary) delete fields.meta.summary.snapshotsFresh;
          if (fields.summary) delete fields.summary.snapshotsFresh;
        }
      }
      payload.data.exportConfigSnapshots = cfgRows;
      if (fields.meta.summary && typeof fields.meta.summary.snapshotsFresh === 'undefined') {
        fields.meta.summary.snapshotsFresh = true;
        if (fields.summary) fields.summary.snapshotsFresh = true;
      }
    } else if (fields.meta.summary && typeof fields.meta.summary.snapshotsFresh === 'undefined') {
      fields.meta.summary.snapshotsFresh = true;
      if (fields.summary) fields.summary.snapshotsFresh = true;
    }
    // 公开上传必须嵌入配置快照内容：否则导入方无法查看/应用每行具体配置（快照读取失败）
    if (
      payload &&
      payload.data &&
      Array.isArray(payload.data.exportConfigSnapshots) &&
      payload.data.exportConfigSnapshots.length &&
      typeof window.embedConfigSnapshotPayloads === 'function'
    ) {
      payload.data.exportConfigSnapshots = await window.embedConfigSnapshotPayloads(
        payload.data.exportConfigSnapshots
      );
    }
    // serializeMember 不写 results：上传时把成员计算结果注入 payload，服务端据此标记 _serverComputed:true
    if (payload && payload.data && Array.isArray(payload.data.members) && Array.isArray(state && state.members)) {
      payload.data.members.forEach(function (m, i) {
        var mm = state.members[i];
        if (mm && mm.results) {
          m.results = {
            total: Number(mm.results.total) || 0,
            dps: Number(mm.results.dps) || 0,
            axisDuration: Number(mm.results.axisDuration) || 0,
            cycleGrandTotal: Number(mm.results.cycleGrandTotal) || 0,
            cycleMode: mm.results.cycleMode || '',
          };
        }
      });
    }
    // 特殊技能（处决/效应等）结果注入：供服务端 buildSummary 累加
    try {
      if (typeof state !== 'undefined' && state && state.specialSkills && state.specialSkills.results) {
        var sr = state.specialSkills.results;
        if (Number(sr.total) > 0) {
          if (!payload.data.specialSkills) payload.data.specialSkills = {};
          payload.data.specialSkills.results = {
            total: Number(sr.total) || 0,
            dps: Number(sr.dps) || 0,
            axisDuration: Number(sr.axisDuration) || 0,
            cycleGrandTotal: Number(sr.cycleGrandTotal) || 0,
            cycleMode: sr.cycleMode || '',
          };
        }
      }
    } catch (e) {}
    return Object.assign({ payload: payload, summary: fields.summary }, fields, extra || {});
  }

    var email = emailEl && emailEl.value || '';
    var pass = passEl && passEl.value || '';
    if (!email) { setStatus('请填写账号', true); return; }
    if (email.indexOf('@') < 0 && (email.length < 2 || email.length > 20)) { setStatus('用户名需 2-20 个字符', true); return; }
    if (pass.length < 6) { setStatus('密码至少 6 位', true); return; }

      var data = await signUp(email, pass);

  <script>
/**
 * 鳴算屋独立登录页 — 鸣潮视觉语言（不跟随主题）
 */
(function () {
  'use strict';

  var root = null;
  var starfield = null;
  var rafId = 0;
  var mode = 'login';
  var openOrigin = '';
  var bound = false;

  var EYE_OPEN =
    '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_OFF =
    '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 10.6a2.5 2.5 0 0 0 3.5 3.5"/><path d="M9.9 5.1A10.5 10.5 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.1 4.1"/><path d="M6.1 6.1A17.4 17.4 0 0 0 2 12s3.5 7 10 7a10.4 10.4 0 0 0 4.2-.9"/></svg>';

  function $(sel) {
    return root && root.querySelector(sel);
  }

  function setStatus(msg, kind) {
    var el = $('[data-wc-auth-status]');
    if (!el) return;
    el.textContent = msg || '';
    el.classList.toggle('is-error', kind === 'error');
    el.classList.toggle('is-ok', kind === 'ok');
  }

  function setMode(next) {
    mode = next === 'register' ? 'register' : 'login';
    if (!root) return;
    root.querySelectorAll('[data-wc-auth-tab]').forEach(function (btn) {
      btn.classList.toggle('is-active', btn.getAttribute('data-wc-auth-tab') === mode);
    });
    var title = $('[data-wc-auth-title]');
    var lead = $('[data-wc-auth-lead]');
    var submit = $('[data-wc-auth-submit]');
    var switchBtn = $('[data-wc-auth-switch]');
    if (mode === 'login') {
      if (title) title.textContent = '欢迎回来';
      if (lead) lead.textContent = '登录以同步你的云端方案数据';
      if (submit) submit.textContent = '登 录';
      if (switchBtn) switchBtn.textContent = '没有账号？去注册';
    } else {
      if (title) title.textContent = '创建账号';
      if (lead) lead.textContent = '注册后即可上传与同步云端方案';
      if (submit) submit.textContent = '注 册';
      if (switchBtn) switchBtn.textContent = '已有账号？去登录';
    }
    setStatus('');
  }

  function initParticles() {
    // 兼容旧调用：改用宇宙星空
  }

  function startFx() {
    stopFx();
    if (!root) return;
    if (!starfield && window.WaveCalcStarfield) {
      starfield = WaveCalcStarfield.create(root, { className: 'wc-auth-stars' });
    }
    if (starfield) starfield.start();
  }

  function stopFx() {
    if (starfield) starfield.stop();
    if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = 0;
    }
  }

  function build() {
    root = document.createElement('div');
    root.id = 'wcAuthPage';
    root.className = 'wc-auth';
    root.setAttribute('role', 'dialog');
    root.setAttribute('aria-modal', 'true');
    root.setAttribute('aria-label', '登录 / 注册');
    root.hidden = true;
    root.innerHTML =
      '<div class="wc-auth-beam top" aria-hidden="true"></div>' +
      '<div class="wc-auth-beam bottom" aria-hidden="true"></div>' +
      '<div class="wc-auth-shell">' +
      '<button type="button" class="wc-auth-close" data-wc-auth-close title="关闭" aria-label="关闭">✕</button>' +
      '<aside class="wc-auth-left">' +
      '<div class="wc-auth-brand">' +
      '<div class="wc-auth-cn">鳴算屋</div>' +
      '<div class="wc-auth-en">WAVECALC</div>' +
      '</div>' +
      '<div class="wc-auth-tags">' +
      '<span class="wc-auth-tag">轴编辑</span>' +
      '<span class="wc-auth-tag">配装优化</span>' +
      '<span class="wc-auth-tag">Buff计算</span>' +
      '<span class="wc-auth-tag">声骸模拟</span>' +
      '<span class="wc-auth-tag">数据导出</span>' +
      '</div>' +
      '</aside>' +
      '<section class="wc-auth-right">' +
      '<h1 class="wc-auth-title" data-wc-auth-title>欢迎回来</h1>' +
      '<p class="wc-auth-lead" data-wc-auth-lead>登录以同步你的云端方案数据</p>' +
      '<div class="wc-auth-tabs" role="tablist">' +
      '<button type="button" class="wc-auth-tab is-active" data-wc-auth-tab="login" role="tab">登录</button>' +
      '<button type="button" class="wc-auth-tab" data-wc-auth-tab="register" role="tab">注册</button>' +
      '</div>' +
      '<label class="wc-auth-field"><span>账号 / 邮箱</span>' +
      '<input data-wc-auth-email type="text" maxlength="64" autocomplete="username" placeholder="用户名（2-20位）或已注册邮箱" />' +
      '</label>' +
      '<label class="wc-auth-field"><span>密码</span>' +
      '<div class="wc-auth-pass-wrap">' +
      '<input data-wc-auth-pass type="password" autocomplete="current-password" placeholder="至少 6 位" />' +
      '<button type="button" class="wc-auth-eye" data-wc-auth-eye title="显示/隐藏密码" aria-label="显示密码">' +
      EYE_OPEN +
      '</button></div></label>' +
      '<label class="wc-auth-agree">' +
      '<input type="checkbox" data-wc-auth-agree />' +
      '<span class="wc-auth-check" aria-hidden="true"></span>' +
      '<span>我已阅读并同意 <a href="terms.html" target="_blank" rel="noopener">《用户协议》</a> 和 ' +

      '<button type="button" class="wc-auth-submit" data-wc-auth-submit>登 录</button>' +
      '<div class="wc-auth-links">' +
      '<button type="button" data-wc-auth-switch>没有账号？去注册</button>' +
      '<span data-wc-auth-forgot>忘记密码？联系管理员重置</span>' +
      '</div>' +
      '<p class="wc-auth-status" data-wc-auth-status></p>' +
      '<p class="wc-auth-note">用户名注册无需邮箱验证；忘记密码请联系管理员并提供账号名。</p>' +

  }

  function onAfterAuthSuccess() {
    close();
    if (window.SiteIntro && typeof SiteIntro.onAuthMaybeEnter === 'function') {
      SiteIntro.onAuthMaybeEnter();
    }
    if (openOrigin === 'profile') {
      openOrigin = '';
      if (window.WaveCalcProfile && typeof WaveCalcProfile.refresh === 'function') {
        WaveCalcProfile.refresh();
      }
      return;
    }
    if (openOrigin === 'cloud' || openOrigin === 'library') {
      var origin = openOrigin;
      openOrigin = '';
      if (window.Cloud && typeof Cloud.open === 'function') {
        Cloud.open(origin === 'library' ? 'library' : 'auth');
      }
      return;
    }
  }

  async function submit() {
    if (!window.Cloud || typeof Cloud.signIn !== 'function') {
      setStatus('云端模块未就绪', 'error');
      return;
    }
    var emailEl = $('[data-wc-auth-email]');
    var passEl = $('[data-wc-auth-pass]');
    var agreeEl = $('[data-wc-auth-agree]');
    var submitBtn = $('[data-wc-auth-submit]');
    var email = (emailEl && emailEl.value) || '';
    var pass = (passEl && passEl.value) || '';
    if (!email || !pass) {
      setStatus('请填写账号和密码', 'error');
      return;
    }
    if (submitBtn) submitBtn.disabled = true;
    try {
      if (mode === 'login') {
        setStatus('登录中…');
        await Cloud.signIn(email, pass);
        setStatus('欢迎回来', 'ok');
        onAfterAuthSuccess();
      } else {
        if (email.indexOf('@') < 0 && (email.length < 2 || email.length > 20)) {
          setStatus('用户名需 2-20 个字符', 'error');
          return;
        }
        if (pass.length < 6) {
          setStatus('密码至少 6 位', 'error');
          return;
        }
        if (!agreeEl || !agreeEl.checked) {
          setStatus('请先阅读并同意《用户协议》和《隐私政策》', 'error');
          return;
        }
        setStatus('注册中…');
        var data = await Cloud.signUp(email, pass);
        if (data && data.access_token) {
          setStatus('注册成功，已自动登录', 'ok');
          onAfterAuthSuccess();
        } else {
          setStatus('注册成功，请前往邮箱完成验证后登录', 'ok');
          setMode('login');
        }
      }
    } catch (err) {
      setStatus((mode === 'login' ? '登录失败：' : '注册失败：') + (err && err.message ? err.message : '未知错误'), 'error');
    } finally {
      if (submitBtn) submitBtn.disabled = false;
    }
  }

  function bind() {
    if (!root || bound) return;
    bound = true;
    root.addEventListener('click', function (e) {
      if (e.target.closest('[data-wc-auth-close]')) {
        close();
        return;
      }
      var tab = e.target.closest('[data-wc-auth-tab]');
      if (tab) {
        setMode(tab.getAttribute('data-wc-auth-tab'));
        return;
      }
      if (e.target.closest('[data-wc-auth-switch]')) {
        setMode(mode === 'login' ? 'register' : 'login');
        return;
      }
      if (e.target.closest('[data-wc-auth-submit]')) {
        void submit();
        return;
      }
      var eye = e.target.closest('[data-wc-auth-eye]');
      if (eye) {
        var pass = $('[data-wc-auth-pass]');
        if (!pass) return;
        var show = pass.type === 'password';
        pass.type = show ? 'text' : 'password';
        eye.innerHTML = show ? EYE_OFF : EYE_OPEN;
        eye.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
      }
    });
    root.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        close();
        return;
      }
      if (e.key === 'Enter' && e.target && (e.target.matches('[data-wc-auth-email]') || e.target.matches('[data-wc-auth-pass]'))) {
        e.preventDefault();
        void submit();
      }
    });
    window.addEventListener('resize', function () {
      if (!root || root.hidden) return;
      if (starfield) starfield.resize();
    });
  }

  function open(opts) {
    openOrigin = (opts && opts.origin) || '';
    if (!root) build();
    bind();
    setMode('login');
    root.hidden = false;
    document.body.classList.add('wc-auth-open');
    startFx();
    var email = $('[data-wc-auth-email]');
    if (email) {
      try {
        email.focus();
      } catch (e) {}
    }
  }

  function close() {
    stopFx();
    if (root) root.hidden = true;
    document.body.classList.remove('wc-auth-open');
  }

  function isOpen() {
    return !!(root && !root.hidden);
  }

  window.WaveCalcAuth = {
    open: open,
    close: close,
    isOpen: isOpen,
  };
})();

/* 声骸配置编辑弹窗（cost 模板 / 套装 / 副词条自定义）
 * 复用 core.js 全局函数与数据（ECHO_LAYOUTS / ECHO_SUB_AFFIXES / 套装库）
 * API: EchoConfigModal.open({ initial, title, onSave }) */
(function () {
  'use strict';

  var state = null;

  function $(sel, root) {
    return (root || document).querySelector(sel);
  }

  function $$(sel, root) {
    return Array.from((root || document).querySelectorAll(sel));
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function deepClone(o) {
    return JSON.parse(JSON.stringify(o));
  }

  function normalizeConfig(raw) {
    if (typeof window.normalizeEchoConfig === 'function') {
      return normalizeEchoConfig(raw || {});
    }
    return raw || { layout: '43311', mainSlotIndex: 0, setLoadout: [], slots: [] };
  }

  function layoutKeyOf(cfg) {
    var label = cfg && cfg.layout;
    if (typeof window.getBuildLayoutKey === 'function') {
      var k = getBuildLayoutKey(cfg);
      if (k) return k;
    }
    if (typeof ECHO_LAYOUTS !== 'undefined') {
      var found = Object.keys(ECHO_LAYOUTS).find(function (kk) {
        return ECHO_LAYOUTS[kk].label === label;
      });
      if (found) return found;
    }
    return '43311';
  }

  function layoutOptions() {
    if (typeof ECHO_LAYOUTS === 'undefined') return [];
    return Object.keys(ECHO_LAYOUTS).map(function (k) {
      return { key: k, label: ECHO_LAYOUTS[k].label, costs: ECHO_LAYOUTS[k].costs };
    });
  }

  function costTotal(cfg) {
    if (typeof window.getEchoCostTotal === 'function') return getEchoCostTotal(cfg);
    return (cfg.slots || []).reduce(function (s, x) {
      return s + (Number(x.cost) || 0);
    }, 0);
  }

  function setDef(setId) {
    return typeof window.findEchoSetDef === 'function' ? findEchoSetDef(setId) : null;
  }

  function allSets() {
    return typeof window.getEchoSetsSorted === 'function' ? getEchoSetsSorted() : [];
  }

  function subAffixOptions(selectedId) {
    var affixes = typeof ECHO_SUB_AFFIXES !== 'undefined' ? ECHO_SUB_AFFIXES : {};
    var out = '<option value="">— 副词条 —</option>';
    Object.keys(affixes).forEach(function (id) {
      var sel = String(id) === String(selectedId) ? ' selected' : '';
      out += '<option value="' + esc(id) + '"' + sel + '>' + esc(affixes[id].label) + '</option>';
    });
    return out;
  }

  function subValueOptions(affixId, currentValue) {
    var affix = (typeof ECHO_SUB_AFFIXES !== 'undefined' && ECHO_SUB_AFFIXES[affixId]) || null;
    if (!affix || !Array.isArray(affix.rolls)) {
      return '<option value="">—</option>';

    return (
      '<option value="">— 档位 —</option>' +
      affix.rolls
        .map(function (r) {
          var sel = Math.abs(Number(r) - Number(currentValue)) < 1e-9 ? ' selected' : '';
          return '<option value="' + r + '"' + sel + '>' + r + unit + '</option>';
        })
        .join('')
    );
  }

  function dmgTypeOptions(current) {
    var types =
      typeof ECHO_SUB_TYPE_DAMAGE_TYPES !== 'undefined' ? ECHO_SUB_TYPE_DAMAGE_TYPES : [];
    return (
      '<option value="">类型</option>' +
      types
        .map(function (t) {

          return '<option value="' + esc(t) + '"' + sel + '>' + esc(t) + '</option>';

  }

  function renderSetRows() {

    var loadout = Array.isArray(cfg.setLoadout) ? cfg.setLoadout : [];
    // 导入锁定：套装由抓取数据决定，只展示已触发的套装，数量不可改
    if (state.locked) {
      var activeSets = loadout.filter(function (e) {
        return e.setId && Number(e.count) > 0;
      });
      var lockedCards = activeSets.length
        ? activeSets
            .map(function (entry) {

                esc(def && def.name ? def.name : entry.setId) +

                '</span>' +
                '<span class="ecm-set-h-name">' +
                esc(def && def.name ? def.name : entry.setId) +

        return (
          '<div class="ecm-set-card-row" data-ecm-set-row="' + i + '">' +
          '<button type="button" class="ecm-set-main" data-ecm-set-pick="' + i + '" title="更换套装">' +
          '<span class="ecm-set-thumb">' +
          (typeof window.renderEchoSetIconHtml === 'function' && def
            ? renderEchoSetIconHtml(def, 'ecm-set-icon')
